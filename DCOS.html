function warrCustSearch(q){WSRCH=q||'';const box=document.getElementById('wcResults');if(!box)return;
  const s=WSRCH.trim().toLowerCase();
  if(s.length<2){box.innerHTML=`<p style="color:var(--muted);font-size:12.5px;margin:2px 0 0">Kam az kam 2 harf likhein \u2014 phir customer ke saare laptop, unke serial aur warranty ka status yahan aa jayega.</p>`;return;}
  const hits=DB.get('bills').filter(b=>[b.customer&&b.customer.name,b.customer&&b.customer.phone1,b.customer&&b.customer.phone2,
    b.serial,b.brand,b.model,('#'+b.invoiceNo)].join(' ').toLowerCase().includes(s));
  if(!hits.length){box.innerHTML=`<div class="banner warn" style="margin:8px 0 0"><span class="bic">\u26A0</span><div style="flex:1">
    <div class="bt">Koi record nahi mila</div><div class="bs">Ye laptop Denzen se nahi bika, ya naam/serial mukhtalif hai. Bina record ke bhi warranty claim bana sakte hain \u2014 lekin pehle tasdeeq kar lein.</div></div></div>`;return;}
  const map={};hits.forEach(b=>{const k=custKey(b.customer)||('x'+b.id);
    if(!map[k])map[k]={info:b.customer||{},bills:[]};map[k].bills.push(b);});
  const groups=Object.keys(map).slice(0,6);
  box.innerHTML=groups.map(k=>{const c=map[k];const bs=c.bills.slice().sort((x,y)=>y.date-x.date);
    const wcnt=custWarrantyCount(c.info.phone1,c.info.name);
    return `<div class="wcust"><div class="wcust-h">
        <b style="font-size:14px">${esc(c.info.name||'\u2014')}</b>
        <span style="font-size:12px;color:var(--muted);font-weight:600">${esc(c.info.phone1||'')}</span>
        <span class="badge b-brand">${bs.length} product</span>
        ${wcnt?`<span class="badge b-purple">${wcnt}\u00d7 warranty claim</span>`:''}</div>
      ${bs.map(b=>`<div class="wprod ${coverEdge(b)}">
        <div style="flex:1;min-width:190px">
          <b style="font-size:13.5px">${esc(b.brand)} ${esc(b.model)}</b>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px">
            <span class="serial-chip" style="font-size:10px">${esc(b.serial||'\u2014')}</span>
            &nbsp;#${b.invoiceNo} \u00b7 kharida ${fmtDate(b.date)} \u00b7 warranty till ${fmtDate(warrantyTillOf(b))}</div></div>
        <div style="min-width:150px">${coverBadge(b)}</div>
        <button class="btn btn-sm ${coverGrade(b)==='expired'?'':'btn-primary'}" onclick="claimFromBill('${b.id}')">\uFF0B Claim banayein</button>
      </div>`).join('')}</div>`;}).join('');}
function claimFromBill(billId){openAddWarranty();pickWarrCust(billId);}
function custWarrantyCount(phone,name){const k=String(phone||name||'').trim().toLowerCase();if(!k)return 0;
  return warranties().filter(w=>String(w.customerPhone||w.customerName||'').trim().toLowerCase()===k).length;}
/* ---------- Reversible status engine (koi bhi status, kisi bhi taraf) ---------- */
const WARR_STATES=[
  {k:'active',    ic:'\u{1F6E0}', t:'Unfixed \u2014 Desk par',   s:'Warranty Desk ki active list mein wapis'},
  {k:'warehouse', ic:'\u{1F3EC}', t:'In Repair \u2014 Warehouse', s:'Warehouse ki Customer Warranty list mein'},
  {k:'claimed',   ic:'\u2713',    t:'Marked Fixed',              s:'Theek \u2014 customer ke pickup ka intezar'},
  {k:'delivered', ic:'\u{1F4E6}', t:'Delivered',                 s:'Completed Warranty mein chala jayega'}];
function warrState(w){if(!w)return 'active';if(w.status==='delivered')return 'delivered';
  if(w.location==='warehouse')return 'warehouse';return w.status==='claimed'?'claimed':'active';}
function warrStateLabel(k){const s=WARR_STATES.find(x=>x.k===k);return s?s.t:k;}
const WARR_RANK={active:0,warehouse:1,claimed:2,delivered:3};
function isUndoMove(from,to){return (WARR_RANK[to]||0)<(WARR_RANK[from]||0);}
function wLogPush(w,txt){const log=(w&&w.log?w.log.slice():[]);log.push({at:now(),by:whoAmI(),txt});return log.slice(-40);}
function openWarrStatus(id){const w=warranties().find(x=>x.id===id);if(!w)return;const cur=warrState(w);
  openModal(`<div class="modal-head"><div class="modal-title">\u21C4 Status Change / Undo</div><button class="modal-x" onclick="closeModal()">\u00d7</button></div>
    <div class="modal-body">
      <div class="linked" style="background:var(--brand-soft);border-color:#f0cdb0"><span style="font-size:18px">\u{1F6E1}</span>
        <div style="font-size:13px;color:var(--brand-d);font-weight:600">#WR-${w.no} \u00b7 ${esc(w.customerName||'\u2014')} \u00b7 ${esc(w.name)} \u00b7 ${esc(w.serial)}</div></div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Ghalti se koi status lag gaya ho to yahan se wapis kar sakte hain \u2014 har taraf change hota hai.</p>
      <div class="statelist">${WARR_STATES.map(st=>{const lock=isUndoMove(cur,st.k)&&!isOwner();
        return `<button class="stbtn ${st.k===cur?'on':''} ${lock?'lock':''}" ${(st.k===cur||lock)?'disabled':`onclick="applyWarrStatus('${id}','${st.k}')"`}>
        <span class="sti">${st.ic}</span><span style="flex:1"><b>${st.t}</b><div class="sts">${st.s}</div></span>
        ${st.k===cur?'<span class="badge b-green">Abhi yahi hai</span>':(lock?'<span class="badge b-gray">\u{1F512} Sirf Owner</span>':'<span class="badge b-brand">Yahan bhejein</span>')}</button>`;}).join('')}</div>
      ${!isOwner()?'<p style="color:var(--muted);font-size:12px;margin-top:10px">Peechay jane wale (undo) options sirf Owner ke liye khule hain. Har change record ho jata hai.</p>':''}
      ${(w.log&&w.log.length)?`<div style="margin-top:18px"><div style="font-weight:800;font-size:13px;margin-bottom:8px">\u{1F553} Status History</div>
        <div class="loglist">${w.log.slice().reverse().map(e=>`<div class="logrow"><span>${esc(e.txt)}</span>
          <span class="logmeta">${fmtDate(e.at)} \u00b7 ${esc(e.by||'')}</span></div>`).join('')}</div></div>`
        :'<div style="margin-top:16px;font-size:12.5px;color:var(--muted)">Abhi tak koi status change record nahi hua.</div>'}
    </div><div class="modal-foot"><button class="btn" onclick="closeModal()">Close</button></div>`,true);}
function applyWarrStatus(id,to){const a=warranties();const i=a.findIndex(w=>w.id===id);if(i<0)return;
  const w=a[i];const from=warrState(w);if(from===to){closeModal();return;}
  if(isUndoMove(from,to)&&!isOwner()){closeModal();
    toast('Undo sirf Owner kar sakta hai \u2014 Owner se login karein','err');return;}
  const n={...w,log:wLogPush(w,warrStateLabel(from)+' \u2192 '+warrStateLabel(to))};
  if(to==='active'){n.status='active';n.location='desk';n.claimedAt=null;n.deliveredAt=null;
    n.repairStatus=(n.repairStatus==='Completed')?'Pending':(n.repairStatus||'');}
  else if(to==='warehouse'){n.status='active';n.location='warehouse';n.whSentAt=now();n.whSentBy=whoAmI();
    n.claimedAt=null;n.deliveredAt=null;n.repairStatus=(n.repairStatus&&n.repairStatus!=='Completed')?n.repairStatus:'Pending';}
  else if(to==='claimed'){n.status='claimed';n.location='desk';n.claimedAt=now();n.deliveredAt=null;n.repairStatus='Completed';}
  else if(to==='delivered'){n.status='delivered';n.location='desk';n.claimedAt=n.claimedAt||now();n.deliveredAt=now();n.repairStatus='Completed';}
  a[i]=n;DB.save('warranties',a);closeModal();toast('Status: '+warrStateLabel(to));
  if(CURRENT==='done')viewDone();else if(CURRENT==='warehouse')viewWarehouse();else viewWarranty();
  buildNav();}
let WFILTER='all';
function setWFilter(v){WFILTER=v;viewWarranty();}
function warrCounts(){const a=warranties();
  return {all:a.filter(w=>w.status!=='delivered').length,
    active:a.filter(w=>warrState(w)==='active').length,
    warehouse:a.filter(w=>warrState(w)==='warehouse').length,
    claimed:a.filter(w=>warrState(w)==='claimed').length,
    delivered:a.filter(w=>warrState(w)==='delivered').length,
    urgent:a.filter(w=>w.status!=='delivered'&&warrantyGrade(w)==='red').length};}
const WF_OPTS=[['all','Sab \u2014 abhi ka kaam'],['active','Unfixed \u2014 Desk par'],['warehouse','In Repair \u2014 Warehouse'],
  ['claimed','Marked Fixed \u2014 pickup ka intezar'],['urgent','Urgent / overdue'],['delivered','Delivered \u2014 mukammal']];
function warrFiltered(){const a=warranties();
  if(WFILTER==='delivered')return a.filter(w=>warrState(w)==='delivered');
  if(WFILTER==='urgent')return a.filter(w=>w.status!=='delivered'&&warrantyGrade(w)==='red');
  if(WFILTER==='all')return a.filter(w=>w.status!=='delivered');
  return a.filter(w=>warrState(w)===WFILTER);}
function viewWarranty(){const F=warrCounts();
  const list=warrFiltered().sort((a,b)=>WFILTER==='delivered'?((b.deliveredAt||0)-(a.deliveredAt||0))
    :(gradeRank(warrantyGrade(a))-gradeRank(warrantyGrade(b))));
  const atWh=F.warehouse;
  const lbl=(WF_OPTS.find(o=>o[0]===WFILTER)||WF_OPTS[0])[1];
  const head=`<div style="display:flex;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap"><div class="sec-title" style="margin:0">Warranty Desk <span class="pill-count">${F.active} active</span></div>
    <button class="btn btn-primary" style="margin-left:auto" onclick="openAddWarranty()">\uFF0B New Warranty</button></div>

    <div class="card card-pad" style="margin-bottom:18px">
      <div class="card-title" style="margin-bottom:10px">\u{1F50E} Customer ki warranty check karein</div>
      <div class="field" style="margin:0"><label>Customer ka naam, phone ya laptop ka serial</label>
        <input id="wcSearch" value="${esc(WSRCH)}" placeholder="e.g. Ali \u00b7 0300-1234567 \u00b7 SN-100\u2026" autocomplete="off" oninput="warrCustSearch(this.value)"></div>
      <div id="wcResults" style="margin-top:12px"></div>
      <p style="color:var(--muted);font-size:12px;margin:12px 0 0">\u{1F7E2} Warranty chal rahi hai \u00b7 \u{1F7E1} 14 din ya kam reh gaye \u00b7 \u{1F534} Khatam ho chuki \u2014 free repair ka haq nahi</p></div>

    <div class="wfbar">
      <label style="font-weight:800;font-size:13px">Status filter:</label>
      <select id="wFilter" onchange="setWFilter(this.value)">
        ${WF_OPTS.map(o=>`<option value="${o[0]}" ${o[0]===WFILTER?'selected':''}>${o[1]} (${F[o[0]]})</option>`).join('')}</select>
      <span class="badge b-brand">${lbl}: <b>${list.length}</b></span>
      ${WFILTER!=='all'?`<button class="btn btn-sm" onclick="setWFilter('all')">\u2715 Filter hatayein</button>`:''}
      <span style="margin-left:auto;color:var(--muted);font-size:12.5px">\u{1F534} Urgent (&lt;1 din) \u00b7 \u{1F7E0} \u22643 din \u00b7 \u{1F7E2} On track \u00b7 \u26AA Fixed
      ${atWh?` \u00b7 <b style="color:var(--brand-d)">${atWh} warehouse mein</b>`:''}</span></div>`;
  if(!list.length){C().innerHTML=head+emptyState('\u{1F6E1}',
    WFILTER==='all'?'Koi warranty claim nahi':'Is filter mein kuch nahi',
    WFILTER==='all'?'Customer laptop laye to yahan add karein.':'Doosra status chunein ya filter hata dein.');
    const e=document.getElementById('wcSearch');if(e&&WSRCH)warrCustSearch(WSRCH);return;}
  const rows=list.map(w=>{const g=warrantyGrade(w);const rem=Math.ceil((w.createdAt+w.days*DAY-now())/DAY);
    const wh=w.location==='warehouse';const whd=wh?daysBetween(w.whSentAt||w.createdAt,now()):0;
    const gb={red:'b-red',orange:'b-orange',green:'b-green',white:'b-gray'}[g];
    const gt=w.status==='claimed'?'Fixed \u00b7 ready for pickup':(rem<0?`${-rem}d overdue`:rem===0?'Due today':`${rem}d left`);
    const cnt=custWarrantyCount(w.customerPhone,w.customerName);
    const act=wh
      ?`<button class="btn btn-sm btn-dark" onclick="setWhTab('cust');go('warehouse')">\u{1F3EC} Track in Warehouse</button>
        ${isOwner()?`<button class="btn btn-sm btn-danger" onclick="applyWarrStatus('${w.id}','active')">\u21BA Wapis Desk</button>`:''}
        <button class="btn btn-sm" onclick="openWarrStatus('${w.id}')">\u21C4 Status</button>
        <button class="btn btn-sm" onclick="warrantyChallan('${w.id}')">\u{1F9FE} Slip</button>`
      :(w.status==='active'
        ?`<button class="btn btn-sm btn-primary" onclick="markClaimed('${w.id}')">\u2713 Mark Fixed</button>
          <button class="btn btn-sm btn-dark" onclick="openSendWarrantyWh('${w.id}')">\u{1F3EC} Send to Warehouse</button>
          <button class="btn btn-sm" onclick="openWarrStatus('${w.id}')">\u21C4 Status</button>
          <button class="btn btn-sm" onclick="warrantyChallan('${w.id}')">\u{1F9FE} Slip</button>`
        :(w.status==='delivered'
          ?`${isOwner()?`<button class="btn btn-sm btn-danger" onclick="applyWarrStatus('${w.id}','claimed')">\u21BA Undo Delivery</button>`:''}
            <button class="btn btn-sm" onclick="openWarrStatus('${w.id}')">\u21C4 Status</button>
            <button class="btn btn-sm" onclick="warrantyChallan('${w.id}')">\u{1F9FE} Slip</button>`
          :`<button class="btn btn-sm btn-dark" onclick="markDelivered('${w.id}')">\u{1F4E6} Delivered</button>
            ${isOwner()?`<button class="btn btn-sm btn-danger" onclick="applyWarrStatus('${w.id}','active')">\u21BA Undo Fixed</button>`:''}
            <button class="btn btn-sm" onclick="openWarrStatus('${w.id}')">\u21C4 Status</button>
            <button class="btn btn-sm" onclick="warrantyChallan('${w.id}')">\u{1F9FE} Slip</button>`));
    return `<tr class="rowcol-${w.status==='delivered'?'green':(wh?'orange':g)}"><td><span class="serial-chip">${esc(w.serial)}</span><div style="font-size:11px;color:var(--muted);margin-top:3px">#WR-${w.no} \u00b7 ${fmtDate(w.createdAt)}</div></td>
      <td><b>${esc(w.customerName||'\u2014')}</b>${cnt>1?`<span class="badge b-purple" style="margin-left:6px">${cnt}\u00d7 warranty</span>`:''}<div style="font-size:11.5px;color:var(--muted)">${esc(w.customerPhone||'')}</div></td>
      <td><b>${esc(w.name)}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(w.processor||'')} \u00b7 ${esc(w.ram||'')} \u00b7 ${esc(w.storage||'')}</div></td>
      <td style="max-width:220px"><div style="color:var(--red);font-weight:600;font-size:13px">\u26A0 ${esc(w.issue)}</div>${w.note?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">\u{1F4DD} ${esc(w.note)}</div>`:''}</td>
      <td>${w.status==='delivered'?`<span class="badge b-green">\u{1F4E6} Delivered</span><div style="font-size:11px;color:var(--muted);margin-top:4px">${fmtDate(w.deliveredAt)}</div>`
             :(wh?`<span class="badge b-orange">\u{1F3EC} In Repair \u2014 Warehouse</span><div style="font-size:11px;color:var(--muted);margin-top:4px">${whd} day${whd===1?'':'s'} \u00b7 ${esc(w.repairStatus||'Pending')}</div>`
             :`<span class="badge ${gb}">${gt}</span>`)}</td>
      <td style="text-align:right;white-space:nowrap">${act}</td></tr>`;}).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ref / Serial</th><th>Customer</th><th>Laptop</th><th>Issue</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  if(WSRCH)warrCustSearch(WSRCH);}

function openSendWarrantyWh(id){const w=warranties().find(x=>x.id===id);if(!w)return;
  openModal(`<div class="modal-head"><div class="modal-title">\u{1F3EC} Send to Warehouse</div><button class="modal-x" onclick="closeModal()">\u00d7</button></div>
    <div class="modal-body">
      <div class="linked" style="background:var(--brand-soft);border-color:#f0cdb0"><span style="font-size:18px">\u{1F6E1}</span>
        <div style="font-size:13px;color:var(--brand-d);font-weight:600">#WR-${w.no} \u00b7 ${esc(w.customerName||'')} \u00b7 ${esc(w.name)} \u00b7 ${esc(w.serial)}</div></div>
      <div class="form-grid">
        <div class="field"><label>Repair status</label>
          <select id="wh_rs" style="padding:10px 12px;border:1.5px solid var(--line);border-radius:10px">${REPAIR_STATES.map(r=>`<option>${r}</option>`).join('')}</select></div>
        <div class="field"><label>Expected return date <span class="opt">(customer ko batane ke liye)</span></label>
          <input type="date" id="wh_exp" value="${toInput(now()+(Number(w.days)||3)*DAY)}"></div></div>
      <div class="field"><label>Note for warehouse <span class="opt">(optional)</span></label><input id="wh_note" placeholder="Kya kaam karwana hai"></div>
      <div style="background:var(--red-soft);color:#b3373b;padding:11px 14px;border-radius:10px;font-size:12.5px;font-weight:600">
        Ye customer ka unit hai \u2014 warehouse mein alag "Customer Warranty" list mein jayega. Ye kabhi stock mein count nahi hoga.</div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-dark" onclick="doSendWarrantyWh('${id}')">Send to Warehouse</button></div>`,true);}
function doSendWarrantyWh(id){const a=warranties();const i=a.findIndex(w=>w.id===id);if(i<0)return;
  const exp=val('wh_exp');const sel=document.getElementById('wh_rs');
  a[i]={...a[i],location:'warehouse',whSentAt:now(),whSentBy:whoAmI(),whNote:val('wh_note'),
    repairStatus:(sel&&sel.value)||'Pending',expectedReturn:exp?new Date(exp).getTime():null,status:'active',
    log:wLogPush(a[i],warrStateLabel(warrState(a[i]))+' \u2192 In Repair \u2014 Warehouse')};
  DB.save('warranties',a);closeModal();toast('Warehouse bhej diya \u2014 Customer Warranty list mein hai');viewWarranty();buildNav();}

function openAddWarranty(){openModal(`<div class="modal-head"><div class="modal-title">New Warranty Claim</div><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field csearch"><label>Search customer <span class="opt">(phone, name or laptop serial)</span></label>
      <input id="wSearch" placeholder="Type phone, name or serial…" oninput="warrSearch(this.value)" autocomplete="off"><div id="wResults"></div></div>
    <div id="wLinked"></div>
    <div class="form-grid">
      <div class="field"><label>Customer Name</label><input id="w_custname" placeholder="Customer name"></div>
      <div class="field"><label>Customer Phone</label><input id="w_custphone" placeholder="03xx-xxxxxxx"></div>
      <div class="field"><label>Laptop Name</label><input id="w_name" placeholder="e.g. Dell Latitude 7420"></div>
      <div class="field"><label>Serial Number</label><input id="w_serial" placeholder="Laptop serial"></div>
      <div class="field"><label>Processor</label><input id="w_processor" placeholder="e.g. Core i5"></div>
      <div class="field"><label>RAM</label><input id="w_ram" placeholder="e.g. 16 GB"></div>
      <div class="field"><label>Storage</label><input id="w_storage" placeholder="e.g. 256 GB SSD"></div>
      <div class="field"><label>Days to complete</label><input id="w_days" type="number" value="3"></div></div>
    <div class="field"><label>Issue</label><input id="w_issue" placeholder="What's the fault?"></div>
    <div class="field"><label>Note <span class="opt">(optional)</span></label><textarea id="w_note" placeholder="Any extra detail…"></textarea></div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveWarranty()">Create & Print Slip</button></div>`,true);}
function warrSearch(q){const box=document.getElementById('wResults');q=(q||'').trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return;}
  const hits=DB.get('bills').filter(b=>[b.customer.name,b.customer.phone1,b.customer.phone2,b.serial,b.brand,b.model].join(' ').toLowerCase().includes(q)).slice(0,6);
  if(!hits.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="cs-list">${hits.map(b=>{
    return `<div class="cs-item" onclick="pickWarrCust('${b.id}')">
      <div style="flex:1;min-width:0"><div class="cs-nm">${esc(b.customer.name)} — ${esc(b.brand)} ${esc(b.model)}</div>
        <div class="cs-ph">${esc(b.customer.phone1||'')} · ${esc(b.serial)} · #${b.invoiceNo}</div></div>
      <span class="cs-cnt">${coverBadge(b)}</span></div>`;}).join('')}</div>`;}
function pickWarrCust(billId){const b=DB.get('bills').find(x=>x.id===billId);if(!b)return;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v||'';};
  set('w_custname',b.customer.name);set('w_custphone',b.customer.phone1);set('w_name',b.brand+' '+b.model);set('w_serial',b.serial);
  set('w_processor',b.specs&&b.specs.generation);set('w_ram',b.specs&&b.specs.ram);set('w_storage',b.specs&&b.specs.storage);
  document.getElementById('wResults').innerHTML='';document.getElementById('wSearch').value='';
  const prev=warranties().filter(w=>String(w.customerPhone||'').trim().toLowerCase()===String(b.customer.phone1||'').trim().toLowerCase());
  const cg=coverGrade(b);
  const cbanner=cg==='expired'
    ?`<div class="banner warn"><span class="bic">\u{1F534}</span><div style="flex:1">
        <div class="bt">Warranty KHATAM ho chuki hai</div>
        <div class="bs">${esc(coverText(b))} \u00b7 Free repair / replacement ka haq nahi banta. Claim phir bhi bana sakte hain, lekin customer ko charges bata dein.</div></div></div>`
    :(cg==='soon'
      ?`<div class="banner"><span class="bic">\u{1F7E1}</span><div style="flex:1">
        <div class="bt">Warranty jald khatam ho rahi hai</div>

      :`<div class="banner" style="background:var(--green-soft);border-color:#bfe6d3"><span class="bic">\u{1F7E2}</span><div style="flex:1">

function installmentBills(){return DB.get('bills').filter(b=>b.isInstallment&&b.remaining>0);}
/* ---------- previous payment context helpers ---------- */
function payList(b){return ((b&&b.payments)||[]).slice().filter(Boolean).sort((x,y)=>(x.date||0)-(y.date||0));}
function lastPay(b){const h=payList(b);return h.length?h[h.length-1]:null;}
function paidTotal(b){return Number((b&&b.paidNow)||0)+payList(b).reduce((s,p)=>s+Number(p.amount||0),0);}
function custInstallments(phone,name){const k=String(phone||name||'').trim().toLowerCase();if(!k)return [];
  return installmentBills().filter(b=>String((b.customer&&(b.customer.phone1||b.customer.name))||'').trim().toLowerCase()===k);}
/* ---------- WhatsApp installment reminder ---------- */
function waNumber(p){let n=String(p||'').replace(/\D/g,'');
  if(!n)return '';
  if(n.indexOf('0092')===0)n=n.slice(2);
  else if(n.indexOf('92')===0&&n.length>=12){}
  else if(n.charAt(0)==='0')n='92'+n.slice(1);
  else if(n.length===10)n='92'+n;
  return n.length>=11?n:'';}

    'Total: '+fmtRs(b.price)+'\nAb tak wasool: '+fmtRs(got)+'\n'+
    (lp?'Pichli payment: '+fmtRs(lp.amount)+' ('+fmtDate(lp.date)+')\n':'')+
    'Baqaya: '+fmtRs(b.remaining)+'\n'+

    '\nBara meherbani payment ka intezam kar dein. Shukriya!\n\nDenzen Computers\nFF-06, Lavish Mall, Tariq Road, Karachi\n0325-1548556';}

function undoInstPayment(id,idx){const b=DB.get('bills').find(x=>x.id===id);if(!b)return;
  if(!isOwner()){toast('Payment undo sirf Owner kar sakta hai','err');return;}
  const p=payList(b)[idx];if(!p)return;
  confirmBox('Ye payment wapis len?',fmtRs(p.amount)+' ('+fmtDate(p.date)+') record se hat jayegi aur baqaya balance itna hi barh jayega.',()=>{
    const arr=DB.get('bills');const i=arr.findIndex(x=>x.id===id);if(i<0)return;
    const h=payList(arr[i]);h.splice(idx,1);
    arr[i].payments=h;arr[i].remaining=Math.max(Number(arr[i].price||0)-paidTotal(arr[i]),0);
    if(arr[i].remaining>0&&!arr[i].nextDueDate)arr[i].nextDueDate=now();
    DB.save('bills',arr);closeModal();toast('Payment undo ho gayi \u2014 balance update');
    viewInstallments();buildNav();});}

  const arr=DB.get('bills');const i=arr.findIndex(x=>x.id===id);const b=arr[i];
  const pm=val('pi_method')||'CASH';let pc=0,po=0;
  const pay=Math.min(amt,b.remaining);
  if(pm==='BOTH'){pc=Number(val('pi_cash'))||0;po=Number(val('pi_online'))||0;
    if(pc+po!==amt){toast('Cash + Online milkar '+fmtRs(amt)+' hona chahiye','err');return;}
    if(pay!==amt){const k=pay/amt;pc=Math.round(pc*k);po=pay-pc;}}
  else if(pm==='ONLINE')po=pay;else pc=pay;
  b.payments=b.payments||[];b.payments.push({amount:pay,date:now(),method:pm,cash:pc,online:po});
  b.remaining=Math.max(b.remaining-pay,0);
  if(b.remaining>0)b.nextDueDate=val('pi_next')?new Date(val('pi_next')).getTime():now()+30*DAY;else b.nextDueDate=null;
  DB.save('bills',arr);closeModal();toast(b.remaining>0?`Payment saved · ${fmtRs(b.remaining)} remaining`:'Installment fully paid! 🎉');
  viewInstallments();buildNav();}

let _rc=null,_bc=null;

function monthlyBuckets(bills){const map={},labels=[];
  for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');map[k]={rev:0,count:0};
    labels.push({k,lbl:d.toLocaleDateString('en',{month:'short'})+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):'')});}
  bills.forEach(b=>{const d=new Date(b.date);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(map[k]){map[k].rev+=Number(b.price);map[k].count++;}});
  return {labels:labels.map(l=>l.lbl),rev:labels.map(l=>map[l.k].rev),count:labels.map(l=>map[l.k].count)};}

  const online=bills.filter(b=>b.payment==='ONLINE').reduce((s,b)=>s+got(b),0);

const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let REV_YEAR=null,REV_MONTH=null;
function yearOptions(bills){const set=new Set();bills.forEach(b=>set.add(new Date(b.date).getFullYear()));
  const cy=new Date().getFullYear();set.add(cy);
  const years=[...set].sort((a,c)=>c-a);
  if(REV_YEAR===null||!years.includes(REV_YEAR))REV_YEAR=cy;

function yearChange(){REV_YEAR=Number(val('yrSel'));REV_MONTH=null;drawYearCharts();}
function pickMonth(i){REV_MONTH=(REV_MONTH===i?null:i);drawYearCharts();}
function yearData(){const bills=DB.get('bills').filter(b=>new Date(b.date).getFullYear()===REV_YEAR);
  const count=Array(12).fill(0),rev=Array(12).fill(0);
  bills.forEach(b=>{const m=new Date(b.date).getMonth();count[m]++;rev[m]+=Number(b.price||0);});
  return {count,rev};}

      meta.data.forEach((pt,i)=>{const v=d.count[i];if(!v)return;
        ctx.fillStyle=(i===REV_MONTH)?'#c4621e':'#12161a';ctx.fillText(String(v),pt.x,pt.y-16);});ctx.restore();}};

    _bc=new Chart(c2,{type:'line',data:{labels:MON,datasets:[{label:'Bills',data:d.count,borderColor:'#1fa971',backgroundColor:g,

            return [c.raw+' bill'+(c.raw===1?'':'s'),'Revenue: '+fmtRs(d.rev[i]),'Avg laptop sale: '+fmtRs(a)];}}}},

      options:{responsive:true,maintainAspectRatio:false,
        onClick:(e,el)=>{if(el&&el.length)pickMonth(el[0].index);},
        onHover:(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default';},
        plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>MON[c[0].dataIndex]+' '+REV_YEAR,
          label:c=>{const i=c.dataIndex;const a=d.count[i]?Math.round(d.rev[i]/d.count[i]):0;
            return ['Revenue: '+fmtRs(d.rev[i]),d.count[i]+' bill'+(d.count[i]===1?'':'s'),'Avg laptop sale: '+fmtRs(a)];}}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rs '+(v/1000)+'k',font:{size:11}},grid:{color:'#eef0f2'},border:{display:false}},
          x:{grid:{display:false},border:{display:false},ticks:{font:{size:11}}}}}});}

/* =============== DAY CLOSING =============== */
let CLOSE_DATE='';
function dayRange(ds){const d=ds?new Date(ds):new Date();d.setHours(0,0,0,0);return [d.getTime(),endOfDay(d.getTime())];}
function closingData(ds){const r=dayRange(ds),a=r[0],z=r[1];
  const bills=DB.get('bills').filter(b=>b.date>=a&&b.date<=z).sort((x,y)=>x.date-y.date);
  let cash=0,online=0,soldValue=0,instDown=0,instCount=0;
  bills.forEach(b=>{const recv=billReceived(b);
    soldValue+=Number(b.price||0);
    if(b.isInstallment){instDown+=recv;instCount++;}
    cash+=billCash(b);online+=billOnline(b);});
  const coll=[];DB.get('bills').forEach(b=>{payList(b).forEach(p=>{if(p.date>=a&&p.date<=z)coll.push({b:b,p:p});});});
  const collAmt=coll.reduce((t,x)=>t+Number(x.p.amount||0),0);
  const collCash=coll.reduce((t,x)=>t+payCash(x.p),0),collOnline=coll.reduce((t,x)=>t+payOnline(x.p),0);
  const added=DB.get('laptops').filter(l=>(l.createdAt||0)>=a&&(l.createdAt||0)<=z).length;
  const wIn=DB.get('warranties').filter(w=>(w.createdAt||0)>=a&&(w.createdAt||0)<=z).length;
  const wOut=DB.get('warranties').filter(w=>w.deliveredAt&&w.deliveredAt>=a&&w.deliveredAt<=z).length;
  const sp={};bills.forEach(b=>{const k=b.salesperson||'\u2014';sp[k]=(sp[k]||0)+Number(b.price||0);});
  return {a:a,z:z,ds:ds,bills:bills,cash:cash,online:online,soldValue:soldValue,instDown:instDown,instCount:instCount,
    coll:coll,collAmt:collAmt,collCash:collCash,collOnline:collOnline,added:added,wIn:wIn,wOut:wOut,sp:sp,
    cashAll:cash+collCash,onlineAll:online+collOnline,total:cash+online+collAmt};}

/* =============== REPORT TO BILAL BHAI =============== */
let BIL={from:'',to:''};
const BIL_C={cash:'#1fa971',online:'#3b82f6',inst:'#ff7c2a'};
function bilalBills(){return DB.get('bills').filter(b=>b.toBilal);}
function bilalRange(){let l=bilalBills();
  if(BIL.from){const a=new Date(BIL.from).setHours(0,0,0,0);l=l.filter(b=>b.date>=a);}
  if(BIL.to){const z=new Date(BIL.to).setHours(23,59,59,999);l=l.filter(b=>b.date<=z);}
  return l.slice().sort((a,b)=>a.date-b.date);}
function bilalTotals(list){let cash=0,online=0,inst=0,total=0,later=0,outst=0;const sp={},rf={};
  list.forEach(b=>{cash+=billCash(b);online+=billOnline(b);
    const on=b.isInstallment?Math.max(Number(b.price||0)-Number(b.paidNow||0),0):0;
    inst+=on;total+=Number(b.price||0);
    if(b.isInstallment){later+=payList(b).reduce((t,p)=>t+Number(p.amount||0),0);outst+=Number(b.remaining||0);}
    const sn=(b.salesperson||'').trim()||'\u2014';sp[sn]=sp[sn]||{n:0,amt:0};sp[sn].n++;sp[sn].amt+=Number(b.price||0);
    const rn=(b.reference||'').trim();if(rn){rf[rn]=rf[rn]||{n:0,amt:0};rf[rn].n++;rf[rn].amt+=Number(b.price||0);}});
  return {cash:cash,online:online,inst:inst,total:total,later:later,outst:outst,sp:sp,rf:rf,
    count:list.length,instCount:list.filter(b=>b.isInstallment).length};}
function setBil(k,v){BIL[k]=v;viewBilal();}
function bilQuick(k){const d=new Date();d.setHours(0,0,0,0);
  if(k==='today'){BIL.from=toInput(d.getTime());BIL.to=toInput(d.getTime());}
  else if(k==='7'){BIL.from=toInput(d.getTime()-6*DAY);BIL.to=toInput(now());}
  else if(k==='month'){BIL.from=toInput(new Date(d.getFullYear(),d.getMonth(),1).getTime());BIL.to=toInput(now());}
  else if(k==='prev'){const a=new Date(d.getFullYear(),d.getMonth()-1,1),z=new Date(d.getFullYear(),d.getMonth(),0);
    BIL.from=toInput(a.getTime());BIL.to=toInput(z.getTime());}
  else {BIL.from='';BIL.to='';}
  viewBilal();}
function setBilal(id,on,thenInvoice){const arr=DB.get('bills');const i=arr.findIndex(x=>x.id===id);if(i<0)return;
  arr[i]={...arr[i],toBilal:!!on,toBilalAt:on?now():null,toBilalBy:on?whoAmI():''};
  DB.save('bills',arr);closeModal();
  toast(on?'Bilal Bhai ki report mein daal diya \u2705':'Report mein nahi daala');
  if(thenInvoice){setTimeout(()=>showInvoice(id),140);return;}
  if(CURRENT==='bilal')viewBilal();buildNav();}

      <p style="font-weight:800;font-size:15.5px;margin-bottom:14px;text-align:center">Ye invoice <span style="color:var(--brand-d)">Report to Bilal Bhai</span> mein daalni hai?</p>

        <button class="pickbtn bad" onclick="setBilal('${id}',0,1)"><div class="pi">\u2716</div><div class="pt">NAHI</div>

      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">${CLOUD.on?'Cloud par data mehfooz hai, phir bhi mahine mein ek dafa backup zaroor lein.':'<b style="color:var(--red)">Cloud off hai \u2014 data sirf is browser mein hai. Regular backup lein.</b>'}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="backupData()">\u2193 Download Backup</button>
        <label class="btn" style="cursor:pointer">\u2191 Restore Backup<input type="file" accept=".json" style="display:none" onchange="restoreData(event)"></label></div></div>
    <div class="card card-pad"><div class="card-title" style="margin-bottom:6px">\u{1F5C4} Data</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Load sample data to explore, or clear everything to start fresh with your own records.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="seedDemo(true)">Load Sample Data</button>
        <button class="btn btn-danger" onclick="clearAll()">Clear All Data</button></div></div></div>`;}
function saveCloudCfg(){const url=val('fb_url'),key=val('fb_key');
  if(!/^https?:\/\//.test(url)){toast('Database URL galat hai \u2014 https:// se shuru hona chahiye','err');return;}
  const has=NODES.some(n=>(CACHE[n]||[]).length>0);
  const go=()=>{Store.set('dz_fb',{databaseURL:url.replace(/\/+$/,''),apiKey:key,projectId:''});
    toast('Cloud settings save \u2014 app dobara load ho rahi hai');setTimeout(()=>location.reload(),900);};
  if(!has){go();return;}
  confirmBox('Cloud connect karne se pehle backup?',
    'Ehtiyatan is device ka poora data ek JSON file mein download ho jayega, phir cloud connect hoga. (Aap ka data mitega nahi \u2014 ye sirf ek extra copy hai.)',
    ()=>{try{backupData();}catch(e){}closeModal();setTimeout(go,600);});}
function disconnectCloud(){confirmBox('Cloud disconnect karein?','App wapis sirf is device ka data dikhayegi. Cloud ka data delete nahi hoga.',()=>{
  Store.set('dz_fb',null);closeModal();setTimeout(()=>location.reload(),300);});}
function savePasswords(){const s=settings();Object.keys(ROLES).forEach(k=>{s.passwords[k]=document.getElementById('pw_'+k).value.trim();});
  s.revenuePassword=document.getElementById('pw_revenue').value.trim();saveSettings(s);toast('Passwords updated');}
function backupData(){const data={laptops:DB.get('laptops'),bills:DB.get('bills'),warranties:DB.get('warranties'),settings:settings(),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Denzen-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded — keep it safe');}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(!d.laptops&&!d.bills){toast('That file is not a Denzen backup','err');return;}
    confirmBox('Restore this backup?','Your current data will be replaced with the backup.',()=>{
      DB.save('laptops',d.laptops||[]);DB.save('bills',d.bills||[]);DB.save('warranties',d.warranties||[]);
      if(d.settings)saveSettings(d.settings);closeModal();toast('Backup restored');go('dashboard');buildNav();});
  }catch(err){toast('Could not read that backup file','err');}};
  r.readAsText(f);}
function clearAll(){confirmBox('Clear ALL data?','Every laptop, bill and warranty record will be deleted. Take a backup first!',()=>{
  DB.save('laptops',[]);DB.save('bills',[]);DB.save('warranties',[]);
  const s=settings();s.invoiceNo=1735;s.warrantyNo=1;saveSettings(s);closeModal();toast('All data cleared');go('dashboard');buildNav();});}
