<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DENZEN Outlet — Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --side:#211d1a; --side2:#2c2621; --side-line:#3a332d;
  --text:#23201d; --muted:#8a8f96; --muted2:#b4b9c0; --line:#e5e7eb;
  --brand:#ff7c2a; --brand-d:#c4621e; --brand-soft:#fff2e8;
  --red:#e5484d; --red-soft:#fdecec; --orange:#f59e0b; --orange-soft:#fef3e2;
  --green:#1fa971; --green-soft:#e7f7ef; --blue:#3b82f6; --blue-soft:#eaf1fe;
  --shadow:0 1px 3px rgba(20,20,30,.06),0 6px 20px rgba(20,20,30,.05);
  --shadow-lg:0 10px 40px rgba(20,20,30,.14);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdd2d8;border-radius:6px;border:2px solid var(--bg)}

/* ---------------- LOGIN ---------------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 70% -10%,#3a2a1e 0%,#1a1613 60%,#141110 100%);padding:20px}
.login-card{width:100%;max-width:410px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow-lg);
  padding:38px 34px 30px;text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{width:78px;height:78px;margin:0 auto 14px;display:block}
.login-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;letter-spacing:.5px}
.login-brand .o{color:var(--brand-d)}
.login-tag{font-size:10px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-top:3px;font-weight:600}
.login-warr{display:inline-block;margin-top:12px;background:var(--brand-soft);color:var(--brand-d);font-weight:700;
  font-size:10px;letter-spacing:1.2px;padding:5px 12px;border-radius:20px}
.login-sec{margin-top:26px;text-align:left}
.login-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.role-btn{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;transition:.15s}
.role-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.role-btn.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(255,124,42,.12)}
.role-ic{font-size:19px}
.role-nm{font-size:12px;font-weight:700;margin-top:4px}
.role-dsc{font-size:9.5px;color:var(--muted);margin-top:1px}
.login-input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:16px;outline:none;transition:.15s}
.login-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,124,42,.12)}
.login-go{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;
  font-weight:700;font-size:15px;padding:13px;border-radius:12px;letter-spacing:.3px;transition:.15s}
.login-go:hover{filter:brightness(1.05)}
.login-err{color:var(--red);font-size:12px;font-weight:600;margin-top:10px;min-height:16px}
.login-hint{font-size:10.5px;color:var(--muted2);margin-top:14px;line-height:1.5}

/* ---------------- APP SHELL ---------------- */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--side);color:#e7e2dc;flex-shrink:0;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:11px}
.sb-logo{width:40px;height:40px;flex-shrink:0}
.sb-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;line-height:1;color:#fff}
.sb-brand .o{color:var(--brand)}
.sb-sub{font-size:8.5px;letter-spacing:1.5px;color:#a79a8c;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-nav{padding:12px 12px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:#c9c0b6;
  font-weight:600;font-size:13.5px;margin-bottom:2px;transition:.13s;width:100%;text-align:left;position:relative}
.nav-item:hover{background:var(--side2);color:#fff}
.nav-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 4px 14px rgba(196,98,30,.35)}
.nav-ic{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-item.on .nav-badge{background:rgba(255,255,255,.28)}
.sb-foot{padding:14px 16px;border-top:1px solid var(--side-line)}
.sb-user{display:flex;align-items:center;gap:10px}
.sb-ava{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-d));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.sb-role{font-size:13px;font-weight:700;color:#fff}
.sb-roled{font-size:10px;color:#a79a8c}
.sb-logout{margin-left:auto;color:#a79a8c;font-size:18px;padding:6px;border-radius:8px;transition:.13s}
.sb-logout:hover{color:#fff;background:var(--side2)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;
  gap:16px;position:sticky;top:0;z-index:20}
.tb-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.2px}
.tb-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.tb-spacer{flex:1}
.tb-search{position:relative}
.tb-search input{width:230px;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel2);outline:none;transition:.15s}
.tb-search input:focus{border-color:var(--brand);background:#fff;width:270px}
.tb-search .si{position:absolute;left:11px;top:9px;color:var(--muted);font-size:15px}
.content{padding:26px;flex:1}

/* ---------------- COMPONENTS ---------------- */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1.5px solid var(--line);
  color:var(--text);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:10px;transition:.14s}
.btn:hover{border-color:#cfd4da;background:var(--panel2)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff}
.btn-primary:hover{filter:brightness(1.06);background:linear-gradient(135deg,var(--brand),var(--brand-d))}
.btn-dark{background:var(--side);border-color:transparent;color:#fff}
.btn-dark:hover{background:#332c26}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--panel2)}
.btn-danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn-danger:hover{background:#fbdede}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-lg{padding:12px 22px;font-size:15px}

.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(228,230,234,.7)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-title{font-weight:700;font-size:15px;font-family:'Montserrat',sans-serif}

.grid{display:grid;gap:16px}
.stat{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden;border:1px solid rgba(228,230,234,.7)}
.stat-ic{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.stat-lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat-val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:27px;margin-top:6px;letter-spacing:-.5px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:3px}

.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eef0f2;color:#6b7280}
.b-brand{background:var(--brand-soft);color:var(--brand-d)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  padding:12px 14px;border-bottom:1.5px solid var(--line);background:var(--panel2);position:sticky;top:0}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
.mono{font-family:'Inter',monospace;font-weight:700;letter-spacing:.5px}
.serial-chip{display:inline-block;font-weight:700;color:var(--brand-d);background:var(--brand-soft);
  padding:3px 9px;border-radius:6px;font-size:12px;letter-spacing:.5px}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}
.field label .opt{color:var(--muted2);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  outline:none;transition:.14s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,124,42,.1)}
.field textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.seg{display:flex;gap:8px}
.seg-opt{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:600;font-size:13px;transition:.13s;background:#fff}
.seg-opt:hover{border-color:var(--brand)}
.seg-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(24,20,16,.55);z-index:60;display:none;align-items:flex-start;
  justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);
  animation:pop .32s cubic-bezier(.2,.9,.3,1.15);margin:auto 0}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px}
.modal-x{margin-left:auto;font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px;transition:.13s}
.modal-x:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-ic{font-size:44px;opacity:.35;margin-bottom:10px}
.empty-t{font-weight:700;font-size:16px;color:var(--text);margin-bottom:5px}
.empty-s{font-size:13px}

.sec-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;margin:2px 0 14px;display:flex;align-items:center;gap:9px}
.pill-count{background:var(--brand-soft);color:var(--brand-d);font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--side);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);
  font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px;animation:slideIn .3s;max-width:340px}
.toast.ok{border-left:4px solid var(--green)}
.toast.err{border-left:4px solid var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

.rowcol-red{box-shadow:inset 4px 0 0 var(--red)}
.rowcol-orange{box-shadow:inset 4px 0 0 var(--orange)}
.rowcol-green{box-shadow:inset 4px 0 0 var(--green)}
.rowcol-white{box-shadow:inset 4px 0 0 #cbd0d6}

/* dashboard warranty boxes */
.wbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.wcell{border-radius:12px;padding:14px;text-align:center}
.wcell .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px}
.wcell .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.wcell.r{background:var(--red-soft)} .wcell.r .n,.wcell.r .l{color:var(--red)}
.wcell.o{background:var(--orange-soft)} .wcell.o .n,.wcell.o .l{color:var(--orange)}
.wcell.g{background:var(--green-soft)} .wcell.g .n,.wcell.g .l{color:var(--green)}
.wtotal{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wtotal .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.wtotal .val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px}

@media(max-width:860px){
  .sidebar{position:fixed;left:-240px;z-index:80;transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}
  .menu-btn{display:inline-flex!important}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .tb-search input{width:150px}
  .tb-search input:focus{width:170px}
}
.menu-btn{display:none;font-size:22px;padding:4px 8px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70}
.scrim.show{display:block}

/* ============ PRINT DOCUMENT (invoice / challan) ============ */
#docArea{position:fixed;left:-9999px;top:0}
.doc{width:794px;min-height:1123px;background:#FBF8F2;padding:52px 46px 40px;position:relative;color:#2b2b2b;
  font-family:'Montserrat',sans-serif}
.doc *{box-sizing:border-box}
.doc-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;
  font-weight:900;font-size:400px;color:#000;opacity:.028;letter-spacing:-20px;z-index:0}
.doc-in{position:relative;z-index:1}
.dh{display:flex;align-items:center}
.dh-logo{width:66px;height:66px}
.dh-mid{padding-left:15px;flex:1}
.dh-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;color:#1f1f1f;line-height:1}
.dh-brand .o{color:var(--brand-d)}
.dh-tag{font-weight:700;font-size:9px;letter-spacing:3.5px;color:#9a8f82;text-transform:uppercase;margin-top:5px}
.dh-r{text-align:right}
.dh-word{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;color:var(--brand-d);letter-spacing:1px}
.dh-sub{font-weight:700;font-size:9px;letter-spacing:2.4px;color:#6b5140;text-transform:uppercase;margin-top:4px}
.d-rule{height:3px;background:linear-gradient(90deg,#c4621e,#ff9a4a 65%,rgba(196,98,30,0));margin:14px 0 0;border-radius:2px}
.d-info{display:flex;margin-top:22px}
.d-info .col{flex:1}
.d-info .col.r{text-align:right}
.d-lbl{font-weight:700;font-size:9px;letter-spacing:1.6px;color:var(--brand-d);text-transform:uppercase}
.d-name{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1f1f1f;margin:3px 0 8px}
.d-line{font-size:12px;color:#3a3a3a;line-height:1.75}
.d-line b{font-weight:600;color:#1f1f1f}
.d-meta{display:inline-block;text-align:left}
.d-meta .row{display:flex;margin:3px 0}
.d-meta .k{font-weight:600;font-size:12px;color:#8a8175;min-width:96px}
.d-meta .v{font-weight:700;font-size:12px;color:#1f1f1f}
.d-pill{display:inline-block;background:#2b2b2b;color:#fff;font-weight:700;font-size:11px;letter-spacing:1px;padding:3px 13px;border-radius:20px}
.d-seclbl{font-weight:700;font-size:10px;letter-spacing:2px;color:#b7ada0;text-transform:uppercase;margin:26px 0 9px}
.itbl{width:100%;border-collapse:collapse}
.itbl thead td{background:var(--brand-d);color:#fff;font-weight:700;font-size:11px;letter-spacing:.8px;
  text-transform:uppercase;padding:11px 14px;text-align:left}
.itbl thead td.c{text-align:center}.itbl thead td.r{text-align:right}
.itbl tbody td{padding:14px;font-size:13px;background:#fff;border-bottom:1px solid #efe7db;vertical-align:middle}
.itbl tbody td.c{text-align:center}.itbl tbody td.r{text-align:right;font-weight:700}
.i-serial{font-weight:700;font-size:12px;color:var(--brand-d);background:#faf0e6;border:1px solid #eccdb2;padding:4px 10px;border-radius:5px}
.i-name{font-weight:700;font-size:15px;color:#1f1f1f}
.i-price{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1f1f1f}
.specrow td{background:#fdfbf7!important;padding:0 14px 14px!important}
.specg{display:flex;border:1px solid #f0e8dc;border-radius:7px;overflow:hidden;margin-top:3px}
.specg .c{flex:1;text-align:center;padding:10px 4px;border-right:1px solid #f0e8dc}
.specg .c:last-child{border-right:none}
.spk{font-weight:700;font-size:8px;letter-spacing:1px;color:var(--brand-d);text-transform:uppercase}
.spv{font-weight:600;font-size:12px;color:#2b2b2b;margin-top:4px}
.d-lower{display:flex;margin-top:26px;align-items:flex-end}
.d-lower .lc{flex:1;display:flex;align-items:center;gap:16px}
.d-lower .rc{flex:1;text-align:right}
.ww{border:1px dashed #d9c3aa;border-radius:9px;padding:13px 15px;display:inline-block}
.ww-l{font-weight:700;font-size:9px;letter-spacing:1.5px;color:var(--brand-d);text-transform:uppercase}
.ww-d{font-weight:600;font-size:13px;color:#2b2b2b;margin-top:5px}
.ww-d .ar{color:var(--brand-d);font-weight:700;margin:0 7px}
.tbox{display:inline-block;min-width:250px;text-align:left}
.subr{display:flex;justify-content:space-between;padding:4px 0}
.subr .k{font-weight:600;font-size:12.5px;color:#8a8175}
.subr .v{font-weight:700;font-size:12.5px;color:#3a3a3a}
.grand{background:#2b2b2b;border-radius:9px;padding:13px 18px;margin-top:9px;display:flex;justify-content:space-between;
  align-items:center;border-top:3px solid var(--brand-d)}
.grand .k{font-weight:600;font-size:11px;letter-spacing:1.5px;color:#e8c9ae;text-transform:uppercase}
.grand .v{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#fff}
.d-terms{margin-top:30px;text-align:center;padding-top:17px;border-top:1px solid #ece3d6}
.d-terms-t{font-family:'Playfair Display',serif;font-weight:700;font-size:14px;color:#1f1f1f;letter-spacing:.5px}
.d-terms-t .u{color:var(--brand-d)}
.d-terms-p{font-size:10.5px;color:#6a6258;line-height:1.65;max-width:560px;margin:8px auto 0}
.d-terms-p b{color:#2b2b2b;font-weight:700}
.d-foot{position:absolute;bottom:34px;left:46px;right:46px;text-align:center}
.d-foot-rule{height:1px;background:#e0d6c6;margin-bottom:10px}
.d-thanks{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:var(--brand-d)}
.d-foot-l{font-size:10.5px;color:#6a6258;margin-top:4px}
.d-foot-l b{color:var(--brand-d);font-weight:700}
.d-foot-tag{font-family:'Playfair Display',serif;font-size:11px;color:#9a8f82;letter-spacing:2px;margin-top:5px}
/* challan specifics */
.ch-statements{margin-top:22px}
.ch-st{display:flex;gap:12px;padding:13px 15px;background:#fff;border:1px solid #efe7db;border-radius:9px;margin-bottom:10px}
.ch-num{width:26px;height:26px;flex-shrink:0;background:var(--brand-soft);color:var(--brand-d);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ch-txt{font-size:12px;color:#4a4038;line-height:1.55}
.ch-txt b{color:#1f1f1f}
.ch-note{margin-top:18px;background:#2b2b2b;color:#fff;border-radius:9px;padding:14px 18px;text-align:center;
  font-weight:700;font-size:12.5px;border-top:3px solid var(--brand-d)}
.ch-datebox{background:var(--brand-soft);border:1px solid #eccdb2;border-radius:10px;padding:16px 18px;text-align:center;margin-top:4px}
.ch-datebox .l{font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--brand-d);text-transform:uppercase}
.ch-datebox .d{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#1f1f1f;margin-top:4px}

@media print{
  body *{visibility:hidden}
  #docArea,#docArea *{visibility:visible}
  #docArea{position:absolute;left:0;top:0}
  .doc{box-shadow:none}
  @page{size:A4;margin:0}
}
</style>

<!-- ============= LOGIN ============= -->
<div id="login">
  <div class="login-card">
    <img class="login-logo" id="loginLogo" alt="Denzen">
    <div class="login-brand">DENZEN <span class="o">COMPUTER</span></div>
    <div class="login-tag">Your Trusted Tech Partner</div>
    <div class="login-warr">1 YEAR LOCAL WARRANTY</div>
    <div class="login-sec">
      <div class="login-lbl">Select access</div>
      <div class="role-grid" id="roleGrid"></div>
      <input type="password" class="login-input" id="loginPass" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="login-go" onclick="doLogin()">Unlock</button>
      <div class="login-err" id="loginErr"></div>
      <div class="login-hint" id="loginHint"></div>
    </div>
  </div>
</div>

<!-- ============= APP ============= -->
<div id="app">
  <div class="scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <img class="sb-logo" id="sbLogo" alt="">
        <div>
          <div class="sb-brand">DENZEN <span class="o">CO.</span></div>
          <div class="sb-sub">Outlet System</div>
        </div>
      </div>
      <nav class="sb-nav" id="sbNav"></nav>
      <div class="sb-foot">
        <div class="sb-user">
          <div class="sb-ava" id="sbAva">O</div>
          <div>
            <div class="sb-role" id="sbRole">Owner</div>
            <div class="sb-roled">Signed in</div>
          </div>
          <button class="sb-logout" onclick="logout()" title="Logout">⏻</button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn btn-ghost" onclick="toggleSidebar(true)">☰</button>
        <div>
          <div class="tb-title" id="tbTitle">Dashboard</div>
          <div class="tb-sub" id="tbSub">Overview of your outlet</div>
        </div>
        <div class="tb-spacer"></div>
        <div class="tb-search">
          <span class="si">⌕</span>
          <input id="globalSearch" placeholder="Search serial, name, phone…" onkeydown="if(event.key==='Enter')quickSearch(this.value)">
        </div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

const Store = (()=>{
  let mem={};
  const can=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();

    get(k,def){try{const v=can?localStorage.getItem(k):mem[k];return v?JSON.parse(v):(def!==undefined?def:null);}catch(e){return def!==undefined?def:null;}},
    set(k,v){const s=JSON.stringify(v);if(can)localStorage.setItem(k,s);else mem[k]=s;},
    can
  };
})();
const DB={
  get:(n)=>Store.get('dz_'+n,[]),
  save:(n,a)=>Store.set('dz_'+n,a),
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAY=86400000;
const now=()=>Date.now();
function fmtRs(n){n=Number(n)||0;return 'Rs '+n.toLocaleString('en-PK');}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateLong(ts){const d=new Date(ts);return d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});}
function daysBetween(a,b){return Math.floor((b-a)/DAY);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- Login ---------- */
function renderRoles(){
  const g=document.getElementById('roleGrid');
  g.innerHTML=Object.entries(ROLES).map(([k,r])=>
    `<button class="role-btn" data-role="${k}" onclick="pickRole('${k}')">
      <div class="role-ic">${r.icon}</div><div class="role-nm">${r.label}</div><div class="role-dsc">${r.desc}</div>
    </button>`).join('');
}
let PICKED='owner';
function pickRole(k){PICKED=k;document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('on',b.dataset.role===k));
  document.getElementById('loginErr').textContent='';document.getElementById('loginPass').focus();}
function doLogin(){
  const pass=document.getElementById('loginPass').value;
  const s=settings();
  if(pass===s.passwords[PICKED]){
    SESSION={role:PICKED};
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    buildNav();
    const first=ROLES[PICKED].views[0];
    go(first==='settings'?'dashboard':first);
    document.getElementById('loginPass').value='';
  }else{
    document.getElementById('loginErr').textContent='Wrong password. Try again.';
  }
}
function logout(){SESSION=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';
  document.getElementById('loginPass').value='';document.getElementById('loginErr').textContent='';}

/* ---------- Nav ---------- */
function buildNav(){
  const allowed=ROLES[SESSION.role].views;
  const nav=NAV.filter(n=>allowed.includes(n.id));
  const badges=warrantyCounts();
  document.getElementById('sbNav').innerHTML=nav.map(n=>{
    let badge='';
    if(n.id==='warranty'&&badges.activeTotal>0)badge=`<span class="nav-badge">${badges.activeTotal}</span>`;
    if(n.id==='warehouse'){const wc=warehouseCount();if(wc>0)badge=`<span class="nav-badge">${wc}</span>`;}
    return `<button class="nav-item" data-nav="${n.id}" onclick="go('${n.id}')"><span class="nav-ic">${n.icon}</span>${n.label}${badge}</button>`;
  }).join('');
  const r=ROLES[SESSION.role];
  document.getElementById('sbAva').textContent=r.label[0];
  document.getElementById('sbRole').textContent=r.label;
}
function go(id){
  CURRENT=id;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('on',b.dataset.nav===id));
  const titles={dashboard:['Dashboard','Overview of your outlet'],inventory:['Inventory','All laptops in stock'],
    pos:['New Sale','Create a bill and invoice'],warehouse:['Warehouse','Stock units under repair'],
    warranty:['Warranty Desk','Customer warranty claims'],done:['Completed Warranty','Delivered & closed claims'],
    revenue:['Revenue','Sales performance'],search:['Search','Find anything fast'],export:['Export Data','Download records to Excel'],
    settings:['Settings','Passwords & data']};
  const t=titles[id]||[id,''];
  document.getElementById('tbTitle').textContent=t[0];
  document.getElementById('tbSub').textContent=t[1];
  toggleSidebar(false);
  ({dashboard:viewDashboard,inventory:viewInventory,pos:viewPOS,warehouse:viewWarehouse,warranty:viewWarranty,
    done:viewDone,revenue:viewRevenue,search:viewSearchPage,export:viewExport,settings:viewSettings}[id]||viewDashboard)();
  buildNav();
}
function toggleSidebar(open){document.getElementById('sidebar').classList.toggle('open',open);document.getElementById('scrim').classList.toggle('show',open);}
const C=()=>document.getElementById('content');

/* ---------- Toast & Modal ---------- */
function toast(msg,type='ok'){const w=document.getElementById('toastWrap');const el=document.createElement('div');
  el.className='toast '+type;el.innerHTML=`<span>${type==='ok'?'✓':'⚠'}</span>${esc(msg)}`;w.appendChild(el);
  setTimeout(()=>{el.style.opacity=0;el.style.transform='translateX(30px)';el.style.transition='.3s';setTimeout(()=>el.remove(),300);},2600);}
function openModal(html,wide){document.getElementById('modalCard').className='modal'+(wide?' wide':'');
  document.getElementById('modalCard').innerHTML=html;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

   ================================================================= */
const SPEC_FIELDS=[
  ['brand','Brand','text'],['model','Model','text'],['generation','Generation','text'],
  ['ram','RAM','text'],['storage','Storage','text'],['cam','Camera','text'],
  ['charger','Charger','text'],['resolution','Resolution','text'],['screen','Screen Size','text'],
  ['touch','Touch / Non-Touch','seg:Touch,Non-Touch'],['finger','Finger Lock','seg:Yes,No'],
  ['face','Face Lock','seg:Yes,No'],['battery','Battery Backup','text'],['serial','Serial Number','text']
];
function inventory(){return DB.get('laptops').filter(l=>l.status!=='sold');}
function laptopColor(l){ if(l.location==='warehouse'){ return daysBetween(l.locChangedAt||l.createdAt,now())>3?'red':'orange'; } return 'green'; }

function viewInventory(){
  const role=ROLES[SESSION.role];
  const list=inventory();
  const canAdd=SESSION.role==='owner'||SESSION.role==='stock';
  const canManage=SESSION.role==='owner';
  let head=`<div style="display:flex;align-items:center;margin-bottom:18px">
     <div class="sec-title" style="margin:0">Inventory <span class="pill-count">${list.length} in stock</span></div>
     <div style="margin-left:auto;display:flex;gap:10px">
       ${canAdd?`<button class="btn btn-primary" onclick="openAddLaptop()">＋ Add Laptop</button>`:''}
     </div></div>`;
  if(!list.length){C().innerHTML=head+emptyState('💻','No laptops yet','Add your first laptop to start building inventory.');return;}
  const rows=list.map(l=>{
    const col=l.location==='warehouse'?laptopColor(l):null;
    const loc=l.location==='warehouse'
      ? `<span class="badge ${col==='red'?'b-red':'b-orange'}">🏬 Warehouse</span>`
      : `<span class="badge b-green">🟢 Outlet</span>`;
    const rowcls = l.location==='warehouse' ? ('rowcol-'+col) : '';
    return `<tr class="${rowcls}">
      <td><span class="serial-chip">${esc(l.serial||'—')}</span></td>
      <td><b>${esc(l.brand)} ${esc(l.model)}</b><div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(l.generation)} · ${esc(l.ram)} · ${esc(l.storage)}</div></td>
      <td style="font-size:12.5px;color:#555">${esc(l.screen||'—')} · ${esc(l.resolution||'—')}<br>${esc(l.touch||'')} ${l.finger==='Yes'?'· 🔒':''}</td>
      <td>${loc}${l.location==='warehouse'&&l.issue?`<div style="font-size:11.5px;color:var(--red);margin-top:4px">⚠ ${esc(l.issue)}</div>`:''}</td>
      <td style="text-align:right">
        <button class="btn btn-sm" onclick="openStatusChange('${l.id}')">Move</button>
        ${canManage?`<button class="btn btn-sm" onclick="openAddLaptop('${l.id}')">Edit</button>`:''}
        ${canManage?`<button class="btn btn-sm btn-danger" onclick="delLaptop('${l.id}')">Del</button>`:''}
      </td></tr>`;
  }).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Serial</th><th>Laptop</th><th>Display / Security</th><th>Location</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function fieldHTML(f,val){
  const [key,label,type]=f;val=val||'';
  if(type.startsWith('seg:')){
    const opts=type.slice(4).split(',');
    return `<div class="field"><label>${label}</label><div class="seg" data-seg="${key}">
      ${opts.map(o=>`<button type="button" class="seg-opt ${val===o?'on':''}" onclick="segPick('${key}','${o}',this)">${o}</button>`).join('')}
      <input type="hidden" id="f_${key}" value="${esc(val)}"></div></div>`;
  }
  return `<div class="field"><label>${label}</label><input id="f_${key}" value="${esc(val)}" placeholder="${label}"></div>`;
}
function segPick(key,val,btn){document.getElementById('f_'+key).value=val;
  btn.parentElement.querySelectorAll('.seg-opt').forEach(b=>b.classList.toggle('on',b===btn));}
function openAddLaptop(id){
  const l=id?DB.get('laptops').find(x=>x.id===id):{};
  const body=`<div class="form-grid">${SPEC_FIELDS.map(f=>fieldHTML(f,l[f[0]])).join('')}</div>`;
  openModal(`<div class="modal-head"><div class="modal-title">${id?'Edit Laptop':'Add Laptop to Inventory'}</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-primary" onclick="saveLaptop('${id||''}')">${id?'Save Changes':'Add to Inventory'}</button></div>`,true);
}
function saveLaptop(id){
  const obj={};SPEC_FIELDS.forEach(f=>obj[f[0]]=(document.getElementById('f_'+f[0]).value||'').trim());
  if(!obj.brand||!obj.model){toast('Brand and Model are required','err');return;}
  if(!obj.serial){toast('Serial Number is required','err');return;}
  let arr=DB.get('laptops');
  if(id){const i=arr.findIndex(x=>x.id===id);arr[i]={...arr[i],...obj};toast('Laptop updated');}
  else{
    if(arr.some(x=>x.serial&&x.serial.toLowerCase()===obj.serial.toLowerCase()&&x.status!=='sold')){toast('This serial already exists in stock','err');return;}
    arr.push({id:uid(),...obj,location:'outlet',issue:'',status:'in_stock',createdAt:now(),locChangedAt:now()});
    toast('Laptop added to inventory');
  }
  DB.save('laptops',arr);closeModal();viewInventory();
}
function delLaptop(id){
  confirmBox('Delete this laptop?','It will be removed from inventory permanently.',()=>{
    DB.save('laptops',DB.get('laptops').filter(x=>x.id!==id));closeModal();viewInventory();toast('Laptop deleted');
  });
}
/* status move outlet<->warehouse with mandatory comment when going to warehouse */
function openStatusChange(id){
  const l=DB.get('laptops').find(x=>x.id===id);
  const toWh=l.location!=='warehouse';
  openModal(`<div class="modal-head"><div class="modal-title">${toWh?'Send to Warehouse':'Return to Outlet'}</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <p style="color:var(--muted);margin-bottom:16px">${esc(l.brand)} ${esc(l.model)} — <span class="serial-chip">${esc(l.serial)}</span></p>
      ${toWh?`<div class="field"><label>What is the issue? <span style="color:var(--red)">*required</span></label>
        <textarea id="whComment" placeholder="Describe the fault (e.g. keyboard not working, battery drains fast)…"></textarea></div>`
      :`<p style="background:var(--green-soft);color:var(--green);padding:12px 14px;border-radius:10px;font-weight:600">This unit will move back to Outlet and become available for sale again.</p>`}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn ${toWh?'btn-dark':'btn-primary'}" onclick="doStatusChange('${id}',${toWh})">${toWh?'Move to Warehouse':'Return to Outlet'}</button></div>`);
}
function doStatusChange(id,toWh){
  let arr=DB.get('laptops');const i=arr.findIndex(x=>x.id===id);
  if(toWh){const c=(document.getElementById('whComment').value||'').trim();
    if(!c){toast('Please write the issue first','err');return;}
    arr[i].location='warehouse';arr[i].issue=c;arr[i].locChangedAt=now();}
  else{arr[i].location='outlet';arr[i].issue='';arr[i].locChangedAt=now();}
  DB.save('laptops',arr);closeModal();toast(toWh?'Moved to warehouse':'Returned to outlet');
  if(CURRENT==='warehouse')viewWarehouse();else viewInventory();
}

/* =================================================================
   WAREHOUSE (outlet stock under repair)
   ================================================================= */
function warehouseList(){return DB.get('laptops').filter(l=>l.location==='warehouse'&&l.status!=='sold');}
function warehouseCount(){return warehouseList().length;}
function viewWarehouse(){
  const list=warehouseList().sort((a,b)=>(a.locChangedAt||0)-(b.locChangedAt||0));
  let head=`<div class="sec-title">Warehouse — Repair Queue <span class="pill-count">${list.length} units</span></div>
    <p style="color:var(--muted);margin:-8px 0 18px;font-size:13px">Outlet stock with issues. Units in warehouse over 3 days turn <b style="color:var(--red)">red</b>.</p>`;
  if(!list.length){C().innerHTML=head+emptyState('🏬','Warehouse is empty','No stock units are under repair right now.');return;}
  const rows=list.map(l=>{
    const d=daysBetween(l.locChangedAt||l.createdAt,now());const col=d>3?'red':'orange';
    return `<tr class="rowcol-${col}">
      <td><span class="serial-chip">${esc(l.serial)}</span></td>
      <td><b>${esc(l.brand)} ${esc(l.model)}</b></td>
      <td style="max-width:280px"><div style="color:var(--red);font-weight:600;font-size:13px">⚠ ${esc(l.issue||'—')}</div></td>
      <td><span class="badge ${d>3?'b-red':'b-orange'}">${d} day${d===1?'':'s'} in warehouse</span></td>
      <td style="text-align:right"><button class="btn btn-sm btn-primary" onclick="openStatusChange('${l.id}')">✓ Fixed — Return</button></td>
    </tr>`;}).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Serial</th><th>Laptop</th><th>Issue (comment)</th><th>Time</th><th style="text-align:right">Action</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}

function generateBill(){
  if(!POS_SELECTED){toast('Select a laptop by serial first','err');return;}
  const price=Number(document.getElementById('b_price').value);
  if(!price||price<=0){toast('Enter a valid sale price','err');return;}
  const name=(document.getElementById('c_name').value||'').trim();
  if(!name){toast('Enter customer name','err');return;}
  const warrM=Number(document.getElementById('b_warr').value)||12;
  const created=now();
  const bill={
    id:uid(),invoiceNo:nextInvoice(),date:created,createdAt:created,
    serial:POS_SELECTED.serial,brand:POS_SELECTED.brand,model:POS_SELECTED.model,
    specs:{generation:val('b_generation'),ram:val('b_ram'),storage:val('b_storage'),resolution:val('b_resolution'),
           screen:POS_SELECTED.screen},
    price:price,payment:val('b_pay'),warrantyMonths:warrM,
    warrantyTill:created+warrM*30.44*DAY,
    customer:{name,email:val('c_email'),phone1:val('c_phone1'),phone2:val('c_phone2'),address:val('c_address'),occupation:val('c_occupation')}
  };
  const bills=DB.get('bills');bills.push(bill);DB.save('bills',bills);
  // minus from stock
  let laps=DB.get('laptops');const i=laps.findIndex(l=>l.id===POS_SELECTED.id);if(i>=0){laps[i].status='sold';laps[i].soldAt=created;}DB.save('laptops',laps);
  toast('Bill #'+bill.invoiceNo+' created · laptop removed from stock');
  POS_SELECTED=null;
  showInvoice(bill.id);
}
const val=(id)=>{const e=document.getElementById(id);return e?(e.value||'').trim():'';};

function warranties(){return DB.get('warranties');}
function warrantyGrade(w){ // by remaining time to due date
  if(w.status==='claimed')return 'white';
  const due=(w.createdAt)+(w.days||0)*DAY;const rem=(due-now())/DAY;
  if(rem<1)return 'red'; if(rem<=3)return 'orange'; return 'green';
}
function warrantyCounts(){
  const act=warranties().filter(w=>w.status==='active');
  let red=0,orange=0,green=0;act.forEach(w=>{const g=warrantyGrade(w);if(g==='red')red++;else if(g==='orange')orange++;else green++;});
  return {red,orange,green,activeTotal:act.length};
}
function viewWarranty(){
  const list=warranties().filter(w=>w.status!=='delivered').sort((a,b)=>gradeRank(warrantyGrade(a))-gradeRank(warrantyGrade(b)));
  let head=`<div style="display:flex;align-items:center;margin-bottom:6px">
     <div class="sec-title" style="margin:0">Warranty Desk <span class="pill-count">${list.filter(w=>w.status==='active').length} active</span></div>
     <button class="btn btn-primary" style="margin-left:auto" onclick="openAddWarranty()">＋ New Warranty</button></div>
   <p style="color:var(--muted);margin:0 0 18px;font-size:13px">🔴 Urgent (&lt;1 day) · 🟠 Due ≤3 days · 🟢 Plenty of time · ⚪ Fixed, awaiting pickup</p>`;
  if(!list.length){C().innerHTML=head+emptyState('🛡️','No warranty claims','When a customer brings a laptop for warranty, add it here.');return;}
  const rows=list.map(w=>{
    const g=warrantyGrade(w);const due=w.createdAt+w.days*DAY;const rem=Math.ceil((due-now())/DAY);
    const gb={red:'b-red',orange:'b-orange',green:'b-green',white:'b-gray'}[g];
    const gt=w.status==='claimed'?'Fixed · awaiting pickup':(rem<0?`${-rem}d overdue`:rem===0?'Due today':`${rem}d left`);

      <tbody>${bills.slice().reverse().slice(0,12).map(b=>`<tr>
        <td class="mono">#${b.invoiceNo}<div style="font-size:11px;color:var(--muted);font-weight:400">${fmtDate(b.date)}</div></td>
        <td><b>${esc(b.customer.name)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(b.customer.phone1||'')}</div></td>

        <td><span class="badge b-brand">${esc(b.payment)}</span></td>

  drawRevChart(bills);
}
function monthlyBuckets(bills){
  const map={};const labels=[];
  for(let i=11;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    map[k]={rev:0,count:0};labels.push({k,lbl:d.toLocaleDateString('en',{month:'short'})+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):'')});}
  bills.forEach(b=>{const d=new Date(b.date);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(map[k]){map[k].rev+=Number(b.price);map[k].count++;}});
  return {labels:labels.map(l=>l.lbl),rev:labels.map(l=>map[l.k].rev),count:labels.map(l=>map[l.k].count)};
}
let _rc=null,_dc=null;
function drawRevChart(bills){
  if(!window.Chart)return;const b=monthlyBuckets(bills);const ctx=document.getElementById('revChart');if(!ctx)return;
  if(_rc)_rc.destroy();
  _rc=new Chart(ctx,{data:{labels:b.labels,datasets:[
    {type:'bar',label:'Revenue',data:b.rev,backgroundColor:'#ff7c2a',borderRadius:6,yAxisID:'y',order:2},
    {type:'line',label:'Bills',data:b.count,borderColor:'#211d1a',backgroundColor:'#211d1a',tension:.35,yAxisID:'y1',order:1,pointRadius:4,pointBackgroundColor:'#211d1a'}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rs '+(v/1000)+'k'},grid:{color:'#eef0f2'}},
      y1:{beginAtZero:true,position:'right',grid:{drawOnChartArea:false},ticks:{stepSize:1}},x:{grid:{display:false}}}}});
}

function runSearch(q){
  q=(q||'').trim().toLowerCase();const box=document.getElementById('searchResults');
  if(q.length<2){box.innerHTML=`<div class="empty"><div class="empty-ic">⌕</div><div class="empty-t">Start typing</div><div class="empty-s">Search across bills, inventory and warranty records.</div></div>`;return;}

/* =================================================================
   EXPORT (Excel)
   ================================================================= */
function viewExport(){
  C().innerHTML=`<div class="card card-pad" style="max-width:640px">
    <div class="card-title" style="margin-bottom:6px">⤓ Export to Excel</div>
    <p style="color:var(--muted);margin-bottom:20px;font-size:13.5px">Download your records as an Excel file. Filter customer invoices by date range if you like.</p>
    <div class="form-grid">
      <div class="field"><label>From date <span class="opt">(optional)</span></label><input type="date" id="ex_from"></div>
      <div class="field"><label>To date <span class="opt">(optional)</span></label><input type="date" id="ex_to"></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary btn-lg" onclick="exportBills()">🧾 Export Invoices / Customers</button>
      <button class="btn btn-dark btn-lg" onclick="exportInventory()">💻 Export Inventory</button>
    </div>
    <p style="color:var(--muted2);font-size:12px;margin-top:16px">Files download as .xlsx and open directly in Excel.</p>
  </div>`;
}
function exportBills(){
  if(!window.XLSX){toast('Excel engine still loading','err');return;}
  let bills=DB.get('bills');
  const f=document.getElementById('ex_from').value,t=document.getElementById('ex_to').value;
  if(f)bills=bills.filter(b=>b.date>=new Date(f).setHours(0,0,0,0));
  if(t)bills=bills.filter(b=>b.date<=new Date(t).setHours(23,59,59,999));
  if(!bills.length){toast('No bills in this range','err');return;}
  const rows=bills.map(b=>({Invoice:'#'+b.invoiceNo,Date:fmtDate(b.date),Customer:b.customer.name,Phone1:b.customer.phone1,Phone2:b.customer.phone2,
    Email:b.customer.email,Address:b.customer.address,Occupation:b.customer.occupation,Serial:b.serial,Laptop:b.brand+' '+b.model,
    RAM:b.specs.ram,Storage:b.specs.storage,Payment:b.payment,Price:Number(b.price),WarrantyTill:fmtDate(b.warrantyTill)}));
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Invoices');
  XLSX.writeFile(wb,'Denzen-Invoices-'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Exported '+rows.length+' invoices');
}
function exportInventory(){
  if(!window.XLSX){toast('Excel engine still loading','err');return;}
  const rows=inventory().map(l=>({Serial:l.serial,Brand:l.brand,Model:l.model,Generation:l.generation,RAM:l.ram,Storage:l.storage,
    Camera:l.cam,Charger:l.charger,Resolution:l.resolution,Screen:l.screen,Touch:l.touch,FingerLock:l.finger,FaceLock:l.face,
    Battery:l.battery,Location:l.location,Issue:l.issue}));
  if(!rows.length){toast('Inventory is empty','err');return;}
  const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Inventory');
  XLSX.writeFile(wb,'Denzen-Inventory-'+new Date().toISOString().slice(0,10)+'.xlsx');toast('Exported '+rows.length+' laptops');
}

/* =================================================================
   DASHBOARD
   ================================================================= */
function viewDashboard(){
  const bills=DB.get('bills');const wc=warrantyCounts();
  const total=bills.reduce((s,b)=>s+Number(b.price||0),0);
  const nowD=new Date();const ym=nowD.getFullYear()+'-'+nowD.getMonth();
  const thisMonth=bills.filter(b=>{const d=new Date(b.date);return d.getFullYear()+'-'+d.getMonth()===ym;});
  const thisMonthRev=thisMonth.reduce((s,b)=>s+Number(b.price),0);
  const wh=warehouseList();const whRed=wh.filter(l=>daysBetween(l.locChangedAt||l.createdAt,now())>3).length;
  const stockN=inventory().filter(l=>l.location==='outlet').length;
  C().innerHTML=`
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      ${stat('This Month Revenue',fmtRs(thisMonthRev),thisMonth.length+' bills this month','#fff2e8','💰')}
      ${stat('Total Revenue',fmtRs(total),bills.length+' invoices all time','#e7f7ef','📈')}
      ${stat('Laptops in Outlet',stockN,'Available for sale','#eaf1fe','💻')}
      ${stat('In Warehouse',wh.length,whRed+' over 3 days','#fef3e2','🏬')}
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:18px">
      <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">🛡 Warranty Claims</div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Customer laptops in for repair</p>
        <div class="wbox">
          <div class="wcell r"><div class="n">${wc.red}</div><div class="l">Urgent</div></div>
          <div class="wcell o"><div class="n">${wc.orange}</div><div class="l">≤ 3 Days</div></div>
          <div class="wcell g"><div class="n">${wc.green}</div><div class="l">On Track</div></div>
        </div>
        <div class="wtotal"><span class="lab">Total active claims</span><span class="val">${wc.activeTotal}</span></div>
      </div>
      <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">🏬 Outlet Stock Repairs</div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Your own stock units under repair</p>
        <div class="wbox" style="grid-template-columns:1fr 1fr">
          <div class="wcell r"><div class="n">${whRed}</div><div class="l">Over 3 Days</div></div>
          <div class="wcell g"><div class="n">${wh.length-whRed}</div><div class="l">Within 3 Days</div></div>
        </div>
        <div class="wtotal"><span class="lab">Total in warehouse</span><span class="val">${wh.length}</span></div>
      </div>
    </div>
    <div class="card"><div class="card-head"><div class="card-title">Monthly Sales Trend</div>
      <button class="btn btn-sm" style="margin-left:auto" onclick="go('revenue')">Full Revenue →</button></div>
      <div class="card-pad"><div style="height:260px"><canvas id="dashChart"></canvas></div></div></div>`;
  if(window.Chart){const b=monthlyBuckets(bills);const ctx=document.getElementById('dashChart');
    if(_dc)_dc.destroy();
    _dc=new Chart(ctx,{type:'bar',data:{labels:b.labels,datasets:[{label:'Revenue',data:b.rev,backgroundColor:'#ff7c2a',borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rs '+(v/1000)+'k'},grid:{color:'#eef0f2'}},x:{grid:{display:false}}}}});}
}

function savePasswords(){const s=settings();Object.keys(ROLES).forEach(k=>{const v=document.getElementById('pw_'+k).value.trim();if(v)s.passwords[k]=v;});
  saveSettings(s);toast('Passwords updated');}
function clearAll(){confirmBox('Clear ALL data?','Every laptop, bill and warranty record will be deleted. This cannot be undone.',()=>{
  DB.save('laptops',[]);DB.save('bills',[]);DB.save('warranties',[]);const s=settings();s.invoiceNo=1735;s.warrantyNo=1;saveSettings(s);
  closeModal();toast('All data cleared');go('dashboard');});}

/* ---------- helpers ---------- */
function stat(lbl,val,sub,bg,ic){return `<div class="stat"><div class="stat-ic" style="background:${bg}">${ic}</div>
  <div class="stat-lbl">${lbl}</div><div class="stat-val">${val}</div><div class="stat-sub">${sub}</div></div>`;}
function emptyState(ic,t,s){return `<div class="card"><div class="empty"><div class="empty-ic">${ic}</div><div class="empty-t">${t}</div><div class="empty-s">${s}</div></div></div>`;}
function confirmBox(title,msg,onYes){window.__yes=onYes;
  openModal(`<div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="color:#555;line-height:1.6">${esc(msg)}</p></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn btn-danger" onclick="(window.__yes&&window.__yes())">Yes, continue</button></div>`);}
