<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DENZEN Outlet — Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef1; --panel:#ffffff; --panel2:#f7f8fa;
  --side:#211d1a; --side2:#2c2621; --side-line:#3a332d;
  --text:#23201d; --muted:#8a8f96; --muted2:#b4b9c0; --line:#e5e7eb;
  --brand:#ff7c2a; --brand-d:#c4621e; --brand-soft:#fff2e8;
  --red:#e5484d; --red-soft:#fdecec; --orange:#f59e0b; --orange-soft:#fef3e2;
  --green:#1fa971; --green-soft:#e7f7ef; --blue:#3b82f6; --blue-soft:#eaf1fe;
  --purple:#8b5cf6; --purple-soft:#f1ecfe;
  --shadow:0 1px 3px rgba(20,20,30,.06),0 6px 20px rgba(20,20,30,.05);
  --shadow-lg:0 10px 40px rgba(20,20,30,.14);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdd2d8;border-radius:6px;border:2px solid var(--bg)}

#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 70% -10%,#3a2a1e 0%,#1a1613 60%,#141110 100%);padding:20px}
.login-card{width:100%;max-width:420px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow-lg);padding:38px 34px 30px;text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{width:78px;height:78px;margin:0 auto 14px;display:block}
.login-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:24px;letter-spacing:.5px}
.login-brand .o{color:var(--brand-d)}
.login-tag{font-size:10px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-top:3px;font-weight:600}
.login-warr{display:inline-block;margin-top:12px;background:var(--brand-soft);color:var(--brand-d);font-weight:700;font-size:10px;letter-spacing:1.2px;padding:5px 12px;border-radius:20px}
.login-sec{margin-top:24px;text-align:left}
.login-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:9px}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.role-btn{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;transition:.15s}
.role-btn:hover{border-color:var(--brand);background:var(--brand-soft)}
.role-btn.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(255,124,42,.12)}
.role-ic{font-size:18px}
.role-nm{font-size:11px;font-weight:700;margin-top:4px;line-height:1.1}
.login-input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-top:16px;outline:none;transition:.15s}
.login-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,124,42,.12)}
.login-go{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:12px;transition:.15s}
.login-go:hover{filter:brightness(1.05)}
.login-err{color:var(--red);font-size:12px;font-weight:600;margin-top:10px;min-height:16px}
.login-hint{font-size:11px;color:var(--muted2);margin-top:12px;line-height:1.5}

#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--side);color:#e7e2dc;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--side-line);display:flex;align-items:center;gap:11px}
.sb-logo{width:40px;height:40px;flex-shrink:0}
.sb-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:17px;line-height:1;color:#fff}
.sb-brand .o{color:var(--brand)}
.sb-sub{font-size:8.5px;letter-spacing:1.5px;color:#a79a8c;text-transform:uppercase;margin-top:3px;font-weight:600}
.sb-nav{padding:10px 12px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:10px;color:#c9c0b6;font-weight:600;font-size:13px;margin-bottom:2px;transition:.13s;width:100%;text-align:left}
.nav-item:hover{background:var(--side2);color:#fff}
.nav-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 4px 14px rgba(196,98,30,.35)}
.nav-ic{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-item.on .nav-badge{background:rgba(255,255,255,.28)}
.sb-foot{padding:14px 16px;border-top:1px solid var(--side-line)}
.sb-user{display:flex;align-items:center;gap:10px}
.sb-ava{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.sb-role{font-size:13px;font-weight:700;color:#fff}
.sb-roled{font-size:10px;color:#a79a8c}
.sb-logout{margin-left:auto;color:#a79a8c;font-size:18px;padding:6px;border-radius:8px;transition:.13s}
.sb-logout:hover{color:#fff;background:var(--side2)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.tb-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.2px}
.tb-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.tb-spacer{flex:1}
.tb-search{position:relative}
.tb-search input{width:230px;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel2);outline:none;transition:.15s}
.tb-search input:focus{border-color:var(--brand);background:#fff;width:270px}
.tb-search .si{position:absolute;left:11px;top:9px;color:var(--muted);font-size:15px}
.content{padding:26px;flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1.5px solid var(--line);color:var(--text);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:10px;transition:.14s}
.btn:hover{border-color:#cfd4da;background:var(--panel2)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-dark{background:var(--side);border-color:transparent;color:#fff}
.btn-dark:hover{background:#332c26}
.btn-green{background:var(--green);border-color:transparent;color:#fff}
.btn-green:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{color:var(--text);background:var(--panel2)}
.btn-danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
.btn-danger:hover{background:#fbdede}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-lg{padding:12px 22px;font-size:15px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(228,230,234,.7)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-title{font-weight:700;font-size:15px;font-family:'Montserrat',sans-serif}
.grid{display:grid;gap:16px}
.stat{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden;border:1px solid rgba(228,230,234,.7)}
.stat-ic{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.stat-lbl{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat-val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;margin-top:6px;letter-spacing:-.5px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:11.5px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-gray{background:#eef0f2;color:#6b7280}
.b-brand{background:var(--brand-soft);color:var(--brand-d)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.sdot.g{background:var(--green);box-shadow:0 0 0 3px rgba(31,169,113,.16)}
.sdot.r{background:var(--red);box-shadow:0 0 0 3px rgba(229,72,77,.16)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:12px 14px;border-bottom:1.5px solid var(--line);background:var(--panel2)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
.mono{font-family:'Inter',monospace;font-weight:700;letter-spacing:.5px}
.serial-chip{display:inline-block;font-weight:700;color:var(--brand-d);background:var(--brand-soft);padding:3px 9px;border-radius:6px;font-size:12px;letter-spacing:.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px}
.field label .opt{color:var(--muted2);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none;transition:.14s;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,124,42,.1)}
.field textarea{resize:vertical;min-height:70px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.seg{display:flex;gap:8px}
.seg-opt{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-weight:600;font-size:13px;transition:.13s;background:#fff}
.seg-opt:hover{border-color:var(--brand)}
.seg-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-d)}
.modal-bg{position:fixed;inset:0;background:rgba(24,20,16,.55);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:pop .32s cubic-bezier(.2,.9,.3,1.15);margin:auto 0}
.modal.wide{max-width:820px}
.modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px}
.modal-x{margin-left:auto;font-size:22px;color:var(--muted);width:32px;height:32px;border-radius:8px;transition:.13s}
.modal-x:hover{background:var(--panel2);color:var(--text)}
.modal-body{padding:22px 24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-ic{font-size:44px;opacity:.35;margin-bottom:10px}
.empty-t{font-weight:700;font-size:16px;color:var(--text);margin-bottom:5px}
.empty-s{font-size:13px}
.sec-title{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px;margin:2px 0 14px;display:flex;align-items:center;gap:9px}
.pill-count{background:var(--brand-soft);color:var(--brand-d);font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
.pill-green{background:var(--green-soft);color:var(--green);font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
.pill-red{background:var(--red-soft);color:var(--red);font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--side);color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:10px;animation:slideIn .3s;max-width:340px}
.toast.ok{border-left:4px solid var(--green)}
.toast.err{border-left:4px solid var(--red)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.rowcol-red{box-shadow:inset 4px 0 0 var(--red)}
.rowcol-orange{box-shadow:inset 4px 0 0 var(--orange)}
.rowcol-green{box-shadow:inset 4px 0 0 var(--green)}
.wbox{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.wcell{border-radius:12px;padding:14px;text-align:center}
.wcell .n{font-family:'Montserrat',sans-serif;font-weight:800;font-size:24px}
.wcell .l{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.wcell.r{background:var(--red-soft)} .wcell.r .n,.wcell.r .l{color:var(--red)}
.wcell.o{background:var(--orange-soft)} .wcell.o .n,.wcell.o .l{color:var(--orange)}
.wcell.g{background:var(--green-soft)} .wcell.g .n,.wcell.g .l{color:var(--green)}
.wtotal{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wtotal .lab{font-size:12.5px;color:var(--muted);font-weight:600}
.wtotal .val{font-family:'Montserrat',sans-serif;font-weight:800;font-size:22px}
.rev-hero{background:linear-gradient(135deg,#2a2320,#191512);border-radius:18px;padding:28px 30px;color:#fff;position:relative;overflow:hidden}
.rev-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,124,42,.35),transparent 70%)}
.rev-hero .lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#c9a888;font-weight:700}
.rev-hero .big{font-family:'Playfair Display',serif;font-weight:800;font-size:44px;margin-top:6px;letter-spacing:-1px}
.rev-hero .sub{color:#b0a89e;font-size:13px;margin-top:6px}
.breakdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bd{border-radius:12px;padding:15px 16px}
.bd .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.85}
.bd .bv{font-family:'Montserrat',sans-serif;font-weight:800;font-size:20px;margin-top:5px}
.filterbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.filterbar .field{margin:0}
.filterbar .field input,.filterbar .field select{padding:8px 11px}
.cust-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:.14s;cursor:pointer}
.cust-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.cust-ava{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--brand-soft),#ffe0c8);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
/* customer search dropdown */
.csearch{position:relative}
.cs-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;max-height:250px;overflow-y:auto;margin-top:4px}
.cs-item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:10px;transition:.1s}
.cs-item:last-child{border-bottom:none}
.cs-item:hover{background:var(--brand-soft)}
.cs-nm{font-weight:700;font-size:13.5px}
.cs-ph{font-size:11.5px;color:var(--muted)}
.cs-cnt{margin-left:auto}
.linked{background:var(--green-soft);border:1px solid #bfe6d3;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.import-drop{border:2px dashed #d7dbe0;border-radius:14px;padding:30px;text-align:center;transition:.15s;background:var(--panel2)}
.import-drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.map-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.map-row:last-child{border:none}
.map-k{font-weight:700;font-size:13px}
.prev-tbl{font-size:11.5px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev-tbl table{width:100%;border-collapse:collapse}
.prev-tbl td,.prev-tbl th{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.prev-tbl th{background:var(--panel2);font-weight:700;position:sticky;top:0}
@media(max-width:920px){.breakdown{grid-template-columns:1fr 1fr}}
@media(max-width:860px){
  .sidebar{position:fixed;left:-244px;z-index:80;transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{left:0}
  .menu-btn{display:inline-flex!important}
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .tb-search input{width:130px}.tb-search input:focus{width:150px}
}
.menu-btn{display:none;font-size:22px;padding:4px 8px}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70}
.scrim.show{display:block}
#docArea{position:fixed;left:-9999px;top:0}
.doc{width:794px;min-height:1123px;background:#FBF8F2;padding:52px 46px 40px;position:relative;color:#2b2b2b;font-family:'Montserrat',sans-serif}
.doc *{box-sizing:border-box}
.doc-wm{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Playfair Display',serif;font-weight:900;font-size:400px;color:#000;opacity:.028;letter-spacing:-20px;z-index:0}
.doc-in{position:relative;z-index:1}
.dh{display:flex;align-items:center}
.dh-logo{width:66px;height:66px}
.dh-mid{padding-left:15px;flex:1}
.dh-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;color:#1f1f1f;line-height:1}
.dh-brand .o{color:var(--brand-d)}
.dh-tag{font-weight:700;font-size:9px;letter-spacing:3.5px;color:#9a8f82;text-transform:uppercase;margin-top:5px}
.dh-r{text-align:right}
.dh-word{font-family:'Playfair Display',serif;font-weight:800;font-size:30px;color:var(--brand-d);letter-spacing:1px}
.dh-sub{font-weight:700;font-size:9px;letter-spacing:2.4px;color:#6b5140;text-transform:uppercase;margin-top:4px}
.d-rule{height:3px;background:linear-gradient(90deg,#c4621e,#ff9a4a 65%,rgba(196,98,30,0));margin:14px 0 0;border-radius:2px}
.d-info{display:flex;margin-top:22px}
.d-info .col{flex:1}
.d-info .col.r{text-align:right}
.d-lbl{font-weight:700;font-size:9px;letter-spacing:1.6px;color:var(--brand-d);text-transform:uppercase}
.d-name{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1f1f1f;margin:3px 0 8px}
.d-line{font-size:12px;color:#3a3a3a;line-height:1.75}
.d-line b{font-weight:600;color:#1f1f1f}
.d-meta{display:inline-block;text-align:left}
.d-meta .row{display:flex;margin:3px 0}
.d-meta .k{font-weight:600;font-size:12px;color:#8a8175;min-width:96px}
.d-meta .v{font-weight:700;font-size:12px;color:#1f1f1f}
.d-pill{display:inline-block;background:#2b2b2b;color:#fff;font-weight:700;font-size:11px;letter-spacing:1px;padding:3px 13px;border-radius:20px}
.d-seclbl{font-weight:700;font-size:10px;letter-spacing:2px;color:#b7ada0;text-transform:uppercase;margin:26px 0 9px}
.itbl{width:100%;border-collapse:collapse}
.itbl thead td{background:var(--brand-d);color:#fff;font-weight:700;font-size:11px;letter-spacing:.8px;text-transform:uppercase;padding:11px 14px;text-align:left}
.itbl thead td.c{text-align:center}.itbl thead td.r{text-align:right}
.itbl tbody td{padding:14px;font-size:13px;background:#fff;border-bottom:1px solid #efe7db;vertical-align:middle}
.itbl tbody td.c{text-align:center}.itbl tbody td.r{text-align:right;font-weight:700}
.i-serial{font-weight:700;font-size:12px;color:var(--brand-d);background:#faf0e6;border:1px solid #eccdb2;padding:4px 10px;border-radius:5px}
.i-name{font-weight:700;font-size:15px;color:#1f1f1f}
.i-price{font-family:'Playfair Display',serif;font-weight:700;font-size:17px;color:#1f1f1f}
.specrow td{background:#fdfbf7!important;padding:0 14px 14px!important}
.specg{display:flex;border:1px solid #f0e8dc;border-radius:7px;overflow:hidden;margin-top:3px}
.specg .c{flex:1;text-align:center;padding:10px 4px;border-right:1px solid #f0e8dc}
.specg .c:last-child{border-right:none}
.spk{font-weight:700;font-size:8px;letter-spacing:1px;color:var(--brand-d);text-transform:uppercase}
.spv{font-weight:600;font-size:12px;color:#2b2b2b;margin-top:4px}
.d-lower{display:flex;margin-top:26px;align-items:flex-end}
.d-lower .lc{flex:1;display:flex;align-items:center;gap:16px}
.d-lower .rc{flex:1;text-align:right}
.ww{border:1px dashed #d9c3aa;border-radius:9px;padding:13px 15px;display:inline-block}
.ww-l{font-weight:700;font-size:9px;letter-spacing:1.5px;color:var(--brand-d);text-transform:uppercase}
.ww-d{font-weight:600;font-size:13px;color:#2b2b2b;margin-top:5px}
.ww-d .ar{color:var(--brand-d);font-weight:700;margin:0 7px}
.tbox{display:inline-block;min-width:260px;text-align:left}
.subr{display:flex;justify-content:space-between;padding:4px 0}
.subr .k{font-weight:600;font-size:12.5px;color:#8a8175}
.subr .v{font-weight:700;font-size:12.5px;color:#3a3a3a}
.subr.paid .v{color:#1fa971}
.grand{background:#2b2b2b;border-radius:9px;padding:13px 18px;margin-top:9px;display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--brand-d)}
.grand .k{font-weight:600;font-size:11px;letter-spacing:1.5px;color:#e8c9ae;text-transform:uppercase}
.grand .v{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#fff}
.instbanner{margin-top:9px;background:#fff4ec;border:1px solid #f3d3b8;border-radius:9px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.instbanner .k{font-weight:700;font-size:11px;color:var(--brand-d);text-transform:uppercase}
.instbanner .v{font-weight:800;font-size:14px;color:#1f1f1f}
.d-terms{margin-top:26px;text-align:center;padding-top:16px;border-top:1px solid #ece3d6}
.d-terms-t{font-family:'Playfair Display',serif;font-weight:700;font-size:14px;color:#1f1f1f}
.d-terms-t .u{color:var(--brand-d)}
.d-terms-p{font-size:10.5px;color:#6a6258;line-height:1.65;max-width:560px;margin:8px auto 0}
.d-terms-p b{color:#2b2b2b;font-weight:700}
.d-foot{position:absolute;bottom:34px;left:46px;right:46px;text-align:center}
.d-foot-rule{height:1px;background:#e0d6c6;margin-bottom:10px}
.d-thanks{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:var(--brand-d)}
.d-foot-l{font-size:10.5px;color:#6a6258;margin-top:4px}
.d-foot-l b{color:var(--brand-d);font-weight:700}
.d-foot-tag{font-family:'Playfair Display',serif;font-size:11px;color:#9a8f82;letter-spacing:2px;margin-top:5px}
.ch-statements{margin-top:20px}
.ch-st{display:flex;gap:12px;padding:13px 15px;background:#fff;border:1px solid #efe7db;border-radius:9px;margin-bottom:10px}
.ch-num{width:26px;height:26px;flex-shrink:0;background:var(--brand-soft);color:var(--brand-d);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ch-txt{font-size:12px;color:#4a4038;line-height:1.55}
.ch-txt b{color:#1f1f1f}
.ch-note{margin-top:16px;background:#2b2b2b;color:#fff;border-radius:9px;padding:14px 18px;text-align:center;font-weight:700;font-size:12.5px;border-top:3px solid var(--brand-d)}
.ch-datebox{background:var(--brand-soft);border:1px solid #eccdb2;border-radius:10px;padding:16px 18px;text-align:center;margin-top:4px}
.ch-datebox .l{font-weight:700;font-size:10px;letter-spacing:1.5px;color:var(--brand-d);text-transform:uppercase}
.ch-datebox .d{font-family:'Playfair Display',serif;font-weight:800;font-size:22px;color:#1f1f1f;margin-top:4px}
/* report doc */
.rep-kpi{display:flex;gap:14px;margin-top:22px}
.rep-k{flex:1;background:#fff;border:1px solid #efe7db;border-radius:11px;padding:16px;text-align:center}
.rep-k.dark{background:#2b2b2b;border-color:#2b2b2b}
.rep-k .l{font-weight:700;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brand-d)}
.rep-k.dark .l{color:#e8c9ae}
.rep-k .v{font-family:'Playfair Display',serif;font-weight:800;font-size:26px;color:#1f1f1f;margin-top:4px}
.rep-k.dark .v{color:#fff}
.rtbl{width:100%;border-collapse:collapse;margin-top:8px}
.rtbl thead td{background:var(--brand-d);color:#fff;font-weight:700;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;padding:9px 10px;text-align:left}
.rtbl tbody td{padding:10px;font-size:11px;background:#fff;border-bottom:1px solid #efe7db;vertical-align:top}
.rtbl tbody td.r{text-align:right;font-weight:700}
@media print{body *{visibility:hidden}#docArea,#docArea *{visibility:visible}#docArea{position:absolute;left:0;top:0}@page{size:A4;margin:0}}

const Store=(()=>{let mem={};const can=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
  return {get(k,d){try{const v=can?localStorage.getItem(k):mem[k];return v?JSON.parse(v):(d!==undefined?d:null);}catch(e){return d!==undefined?d:null;}},
    set(k,v){const s=JSON.stringify(v);if(can)localStorage.setItem(k,s);else mem[k]=s;},can};})();
const DB={get:n=>Store.get('dz_'+n,[]),save:(n,a)=>Store.set('dz_'+n,a)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DAY=86400000;const now=()=>Date.now();
function fmtRs(n){n=Number(n)||0;return 'Rs '+n.toLocaleString('en-PK');}
function fmtDate(ts){if(!ts)return '—';const d=new Date(ts);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateLong(ts){const d=new Date(ts);return d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});}
function toInput(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){return Math.floor((b-a)/DAY);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function endOfDay(ts){const d=new Date(ts);d.setHours(23,59,59,999);return d.getTime();}
const val=id=>{const e=document.getElementById(id);return e?(e.value||'').trim():'';};

function settings(){return Store.get('dz_settings',{passwords:{owner:'',pos:'',stock:'',warehouse:'',warranty:''},revenuePassword:'',invoiceNo:1735,warrantyNo:1});}
function saveSettings(s){Store.set('dz_settings',s);}
function nextInvoice(){const s=settings();const n=s.invoiceNo;s.invoiceNo=n+1;saveSettings(s);return n;}
function nextWarrantyNo(){const s=settings();const n=s.warrantyNo;s.warrantyNo=n+1;saveSettings(s);return n;}

const ROLES={
  owner:{label:'Owner',icon:'👑',views:['dashboard','pos','inventory','warehouse','warranty','done','installments','customers','revenue','search','export','settings']},
  pos:{label:'Cashier',icon:'🧾',views:['pos']},
  stock:{label:'Stock',icon:'📦',views:['inventory']},
  warehouse:{label:'Warehouse',icon:'🏬',views:['warehouse']},
  warranty:{label:'Warranty',icon:'🛡️',views:['warranty','done']},
};
const NAV=[{id:'dashboard',label:'Dashboard',icon:'▦'},{id:'pos',label:'New Sale (POS)',icon:'🧾'},{id:'inventory',label:'Inventory',icon:'💻'},
  {id:'warehouse',label:'Warehouse',icon:'🏬'},{id:'warranty',label:'Warranty Desk',icon:'🛡'},{id:'done',label:'Completed Warranty',icon:'✔'},
  {id:'installments',label:'Installments',icon:'💳'},{id:'customers',label:'Customers',icon:'👥'},{id:'revenue',label:'Revenue',icon:'📈'},
  {id:'search',label:'Search',icon:'⌕'},{id:'export',label:'Export Data',icon:'⤓'},{id:'settings',label:'Settings',icon:'⚙'}];
let SESSION=null,CURRENT='dashboard',PICKED='owner',revUnlocked=false;

function renderRoles(){document.getElementById('roleGrid').innerHTML=Object.entries(ROLES).map(([k,r])=>
  `<button class="role-btn" data-role="${k}" onclick="pickRole('${k}')"><div class="role-ic">${r.icon}</div><div class="role-nm">${r.label}</div></button>`).join('');}
function pickRole(k){PICKED=k;document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('on',b.dataset.role===k));
  document.getElementById('loginErr').textContent='';const hasPw=settings().passwords[k]!=='';
  const pf=document.getElementById('loginPass'),go=document.querySelector('.login-go');
  pf.style.display=hasPw?'block':'none';go.textContent=hasPw?'Unlock':'Open';if(hasPw){pf.value='';pf.focus();}}
function doLogin(){const stored=settings().passwords[PICKED];const inp=document.getElementById('loginPass').value;
  if(stored===''||inp===stored){SESSION={role:PICKED};revUnlocked=false;
    document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';
    buildNav();const f=ROLES[PICKED].views[0];go(f);document.getElementById('loginPass').value='';}
  else document.getElementById('loginErr').textContent='Wrong password. Try again.';}
function logout(){SESSION=null;revUnlocked=false;document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';document.getElementById('loginPass').value='';document.getElementById('loginErr').textContent='';pickRole(PICKED);}

function buildNav(){const allowed=ROLES[SESSION.role].views;const nav=NAV.filter(n=>allowed.includes(n.id));
  const wc=warrantyCounts(),due=installmentsDue().length,whc=warehouseList().length,raw=rawStock().length;
  document.getElementById('sbNav').innerHTML=nav.map(n=>{let b='';
    if(n.id==='warranty'&&wc.activeTotal>0)b=`<span class="nav-badge">${wc.activeTotal}</span>`;
    if(n.id==='warehouse'&&whc>0)b=`<span class="nav-badge">${whc}</span>`;
    if(n.id==='installments'&&due>0)b=`<span class="nav-badge">${due}</span>`;
    if(n.id==='inventory'&&raw>0)b=`<span class="nav-badge">${raw}</span>`;
    return `<button class="nav-item" data-nav="${n.id}" onclick="go('${n.id}')"><span class="nav-ic">${n.icon}</span>${n.label}${b}</button>`;}).join('');
  const r=ROLES[SESSION.role];document.getElementById('sbAva').textContent=r.label[0];document.getElementById('sbRole').textContent=r.label;}
function go(id){
  if(id==='revenue'&&settings().revenuePassword!==''&&!revUnlocked)return revenueGate();
  CURRENT=id;document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('on',b.dataset.nav===id));
  const t={dashboard:['Dashboard','Daily operations overview'],inventory:['Inventory','Ready stock & raw entries'],pos:['New Sale','Create a bill and invoice'],
    warehouse:['Warehouse','Stock units under repair'],warranty:['Warranty Desk','Customer warranty claims'],done:['Completed Warranty','Delivered & closed'],
    installments:['Installments','Track instalment payments'],customers:['Customers','Buyers, salespersons & references'],revenue:['Revenue','Sales & money'],
    search:['Search','Find anything fast'],export:['Export Data','Download to Excel'],settings:['Settings','Passwords, backup & data']}[id]||[id,''];
  document.getElementById('tbTitle').textContent=t[0];document.getElementById('tbSub').textContent=t[1];toggleSidebar(false);
  ({dashboard:viewDashboard,inventory:viewInventory,pos:viewPOS,warehouse:viewWarehouse,warranty:viewWarranty,done:viewDone,installments:viewInstallments,
    customers:viewCustomers,revenue:viewRevenue,search:viewSearchPage,export:viewExport,settings:viewSettings}[id]||viewDashboard)();
  buildNav();}
function toggleSidebar(o){document.getElementById('sidebar').classList.toggle('open',o);document.getElementById('scrim').classList.toggle('show',o);}
const C=()=>document.getElementById('content');
function revenueGate(){CURRENT='revenue';document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('on',b.dataset.nav==='revenue'));
  document.getElementById('tbTitle').textContent='Revenue';document.getElementById('tbSub').textContent='Protected section';
  C().innerHTML=`<div class="card card-pad" style="max-width:420px;margin:40px auto;text-align:center"><div style="font-size:40px">🔒</div>
    <div class="card-title" style="margin:10px 0 4px">Revenue is locked</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Enter the revenue password to view sales & money.</p>
    <input id="revPw" type="password" style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px" placeholder="Revenue password" onkeydown="if(event.key==='Enter')tryRevPw()">
    <button class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:12px" onclick="tryRevPw()">Unlock Revenue</button>
    <div id="revErr" style="color:var(--red);font-size:12px;font-weight:600;margin-top:10px;min-height:14px"></div></div>`;
  setTimeout(()=>{const e=document.getElementById('revPw');if(e)e.focus();},50);}
function tryRevPw(){if(document.getElementById('revPw').value===settings().revenuePassword){revUnlocked=true;go('revenue');}
  else document.getElementById('revErr').textContent='Wrong password.';}

function toast(m,t='ok'){const w=document.getElementById('toastWrap');const el=document.createElement('div');el.className='toast '+t;
  el.innerHTML=`<span>${t==='ok'?'✓':'⚠'}</span>${esc(m)}`;w.appendChild(el);
  setTimeout(()=>{el.style.opacity=0;el.style.transition='.3s';setTimeout(()=>el.remove(),300);},2600);}
function openModal(h,wide){document.getElementById('modalCard').className='modal'+(wide?' wide':'');
  document.getElementById('modalCard').innerHTML=h;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function stat(l,v,s,bg,ic){return `<div class="stat"><div class="stat-ic" style="background:${bg}">${ic}</div><div class="stat-lbl">${l}</div><div class="stat-val">${v}</div><div class="stat-sub">${s}</div></div>`;}
function emptyState(ic,t,s){return `<div class="card"><div class="empty"><div class="empty-ic">${ic}</div><div class="empty-t">${t}</div><div class="empty-s">${s}</div></div></div>`;}
function confirmBox(t,m,onYes){window.__yes=onYes;openModal(`<div class="modal-head"><div class="modal-title">${esc(t)}</div><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body"><p style="color:#555;line-height:1.6">${esc(m)}</p></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="(window.__yes&&window.__yes())">Yes, continue</button></div>`);}
function segPick(k,v,btn){document.getElementById('f_'+k).value=v;btn.parentElement.querySelectorAll('.seg-opt').forEach(b=>b.classList.toggle('on',b===btn));}

/* =============== INVENTORY (2 stages) =============== */
const RAW_FIELDS=[['brand','Brand','text'],['model','Model','text'],['serial','Serial Number','text'],['ram','RAM','text'],['storage','Storage (ROM)','text']];
const FULL_FIELDS=[['generation','Generation','text'],['cam','Camera','text'],['resolution','Resolution','text'],['screen','Screen Size','text'],
  ['touch','Touch / Non-Touch','seg:Touch,Non-Touch'],['finger','Finger Lock','seg:Yes,No'],['face','Face Lock','seg:Yes,No'],['battery','Battery Backup','text']];
const ALL_FIELDS=RAW_FIELDS.concat(FULL_FIELDS);
function inventory(){return DB.get('laptops').filter(l=>l.status!=='sold');}
function readyStock(){return inventory().filter(l=>l.stage==='ready');}
function rawStock(){return inventory().filter(l=>l.stage!=='ready');}
function warehouseList(){return DB.get('laptops').filter(l=>l.location==='warehouse'&&l.status!=='sold');}
function laptopColor(l){return l.location==='warehouse'?(daysBetween(l.locChangedAt||l.createdAt,now())>3?'red':'orange'):'green';}
let _pie=null;
function viewInventory(){
  const ready=readyStock(),raw=rawStock();const total=ready.length+raw.length;
  const pct=total?Math.round(ready.length/total*100):0;
  const canAdd=SESSION.role==='owner'||SESSION.role==='stock';const canDel=SESSION.role==='owner';
  C().innerHTML=`
   <div class="grid" style="grid-template-columns:1fr 1fr 1.3fr;margin-bottom:20px">
     <div class="stat" style="border-left:4px solid var(--green)"><div class="stat-ic" style="background:var(--green-soft)">✅</div>
       <div class="stat-lbl">100% Final Stock</div><div class="stat-val" style="color:var(--green)">${ready.length}</div><div class="stat-sub">Fully checked & ready to sell</div></div>
     <div class="stat" style="border-left:4px solid var(--red)"><div class="stat-ic" style="background:var(--red-soft)">⏳</div>
       <div class="stat-lbl">Raw Stock Entry</div><div class="stat-val" style="color:var(--red)">${raw.length}</div><div class="stat-sub">Not checked yet</div></div>
     <div class="card card-pad" style="display:flex;align-items:center;gap:18px">
       <div style="width:130px;height:130px;flex-shrink:0"><canvas id="stockPie"></canvas></div>
       <div><div style="font-family:'Montserrat';font-weight:800;font-size:15px;margin-bottom:8px">Stock Readiness</div>
         <div style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:5px"><span class="dot" style="background:var(--green)"></span> Ready <b style="margin-left:auto">${pct}%</b></div>
         <div style="display:flex;align-items:center;gap:8px;font-size:13px"><span class="dot" style="background:var(--red)"></span> Not Ready <b style="margin-left:auto">${100-pct}%</b></div>
         <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)">Total <b style="color:var(--text)">${total}</b> laptops</div></div></div>
   </div>
   <div style="display:flex;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
     <div class="sec-title" style="margin:0"><span class="sdot g"></span> 100% Final Stock <span class="pill-green">${ready.length}</span></div>
     <div style="margin-left:auto;display:flex;gap:8px">
       ${canAdd?`<button class="btn" onclick="openImport()">⤒ Import from Sheet/Excel</button>`:''}
       ${canAdd?`<button class="btn btn-primary" onclick="openRawEntry()">＋ New Stock Entry</button>`:''}</div></div>
   ${ready.length?tblReady(ready,canDel):emptyState('✅','No final stock yet','Complete the checking of a raw entry to move it here.')}
   <div style="display:flex;align-items:center;margin:26px 0 14px">
     <div class="sec-title" style="margin:0"><span class="sdot r"></span> Raw Stock Entry <span class="pill-red">${raw.length}</span></div>
     <span style="margin-left:auto;font-size:12.5px;color:var(--muted)">Arrived but not checked — complete specs to make ready</span></div>
   ${raw.length?tblRaw(raw,canDel):emptyState('⏳','No raw entries','Newly arrived laptops appear here until fully checked.')}`;
  drawPie(ready.length,raw.length);}
function tblReady(list,canDel){
  const rows=list.map(l=>{const wh=l.location==='warehouse';const col=wh?laptopColor(l):null;
   return `<tr class="${wh?'rowcol-'+col:''}">
    <td><span class="sdot g"></span></td>
    <td><span class="serial-chip">${esc(l.serial||'—')}</span></td>
    <td><b>${esc(l.brand)} ${esc(l.model)}</b><div style="color:var(--muted);font-size:12px;margin-top:2px">${esc(l.generation||'')} · ${esc(l.ram)} · ${esc(l.storage)}</div></td>
    <td style="font-size:12.5px;color:#555">${esc(l.screen||'—')} · ${esc(l.resolution||'—')}<br>${esc(l.touch||'')}${l.finger==='Yes'?' · 🔒':''}${l.battery?' · 🔋'+esc(l.battery):''}</td>
    <td>${wh?`<span class="badge ${col==='red'?'b-red':'b-orange'}">🏬 Warehouse</span>${l.issue?`<div style="font-size:11.5px;color:var(--red);margin-top:4px">⚠ ${esc(l.issue)}</div>`:''}`:`<span class="badge b-green">🟢 Outlet</span>`}</td>
    <td style="text-align:right;white-space:nowrap"><button class="btn btn-sm" onclick="openStatusChange('${l.id}')">Move</button>
      <button class="btn btn-sm" onclick="openFullEntry('${l.id}')">Edit</button>
      ${canDel?`<button class="btn btn-sm btn-danger" onclick="delLaptop('${l.id}')">Del</button>`:''}</td></tr>`;}).join('');
  return `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:34px"></th><th>Serial</th><th>Laptop</th><th>Specs</th><th>Location</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
function tblRaw(list,canDel){
  const rows=list.map(l=>`<tr class="rowcol-red">
    <td><span class="sdot r"></span></td>
    <td><span class="serial-chip">${esc(l.serial||'—')}</span></td>
    <td><b>${esc(l.brand)} ${esc(l.model)}</b></td>
    <td style="font-size:12.5px;color:#555">${esc(l.ram||'—')} · ${esc(l.storage||'—')}</td>
    <td><span class="badge b-red">Not checked</span><div style="font-size:11px;color:var(--muted);margin-top:3px">Added ${fmtDate(l.createdAt)}</div></td>
    <td style="text-align:right;white-space:nowrap"><button class="btn btn-sm btn-green" onclick="openFullEntry('${l.id}')">✓ Final Ready Stock</button>
      ${canDel?`<button class="btn btn-sm btn-danger" onclick="delLaptop('${l.id}')">Del</button>`:''}</td></tr>`).join('');
  return `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:34px"></th><th>Serial</th><th>Laptop</th><th>RAM / ROM</th><th>Status</th><th style="text-align:right">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
function drawPie(ready,raw){if(!window.Chart)return;const ctx=document.getElementById('stockPie');if(!ctx)return;if(_pie)_pie.destroy();
  _pie=new Chart(ctx,{type:'doughnut',data:{labels:['Ready','Not Ready'],datasets:[{data:[ready,raw],backgroundColor:['#1fa971','#e5484d'],borderWidth:0,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false},tooltip:{enabled:true}}}});}
function fieldHTML(f,v){const [k,l,t]=f;v=v||'';
  if(t.startsWith('seg:')){const o=t.slice(4).split(',');
    return `<div class="field"><label>${l}</label><div class="seg">${o.map(x=>`<button type="button" class="seg-opt ${v===x?'on':''}" onclick="segPick('${k}','${x}',this)">${x}</button>`).join('')}<input type="hidden" id="f_${k}" value="${esc(v)}"></div></div>`;}
  return `<div class="field"><label>${l}</label><input id="f_${k}" value="${esc(v)}" placeholder="${l}"></div>`;}
/* Stage 1 — quick raw entry */
function openRawEntry(){openModal(`<div class="modal-head"><div class="modal-title">New Stock Entry <span style="font-size:12px;color:var(--red);font-weight:700;margin-left:8px">RAW</span></div><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body"><p style="color:var(--muted);font-size:13px;margin-bottom:16px">Laptop just arrived — enter only the basics. You can complete the full checking later.</p>
    <div class="form-grid">${RAW_FIELDS.map(f=>fieldHTML(f)).join('')}</div></div>
  <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveRaw()">Add to Raw Stock</button></div>`);}
function saveRaw(){const o={};RAW_FIELDS.forEach(f=>o[f[0]]=val('f_'+f[0]));
  if(!o.brand||!o.model){toast('Brand and Model are required','err');return;}
  if(!o.serial){toast('Serial Number is required','err');return;}
  const arr=DB.get('laptops');
  if(arr.some(x=>x.serial&&x.serial.toLowerCase()===o.serial.toLowerCase()&&x.status!=='sold')){toast('This serial already exists in stock','err');return;}
  arr.push({id:uid(),...o,stage:'raw',location:'outlet',issue:'',status:'in_stock',createdAt:now(),locChangedAt:now()});
  DB.save('laptops',arr);closeModal();toast('Added to Raw Stock');viewInventory();buildNav();}
/* Stage 2 — full checking → ready */
function openFullEntry(id){const l=DB.get('laptops').find(x=>x.id===id);const isReady=l.stage==='ready';
  openModal(`<div class="modal-head"><div class="modal-title">${isReady?'Edit Laptop':'Complete Checking → Final Ready Stock'}</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">${!isReady?`<div class="linked" style="background:var(--brand-soft);border-color:#f0cdb0"><span style="font-size:18px">🔧</span><div style="font-size:13px;color:var(--brand-d);font-weight:600">Fill in everything you checked. Once saved, this laptop moves to <b>100% Final Stock</b>.</div></div>`:''}
      <div class="form-grid">${ALL_FIELDS.map(f=>fieldHTML(f,l[f[0]])).join('')}</div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn ${isReady?'btn-primary':'btn-green'}" onclick="saveFull('${id}')">${isReady?'Save Changes':'✓ Mark as Final Ready Stock'}</button></div>`,true);}
function saveFull(id){const o={};ALL_FIELDS.forEach(f=>o[f[0]]=val('f_'+f[0]));
  if(!o.brand||!o.model||!o.serial){toast('Brand, Model and Serial are required','err');return;}
  const arr=DB.get('laptops');const i=arr.findIndex(x=>x.id===id);
  const wasRaw=arr[i].stage!=='ready';
  arr[i]={...arr[i],...o,stage:'ready',readyAt:arr[i].readyAt||now()};
  DB.save('laptops',arr);closeModal();toast(wasRaw?'Moved to 100% Final Stock ✅':'Laptop updated');viewInventory();buildNav();}
function delLaptop(id){confirmBox('Delete this laptop?','It will be removed from inventory permanently.',()=>{DB.save('laptops',DB.get('laptops').filter(x=>x.id!==id));closeModal();viewInventory();buildNav();toast('Laptop deleted');});}
function openStatusChange(id){const l=DB.get('laptops').find(x=>x.id===id);const toWh=l.location!=='warehouse';
  openModal(`<div class="modal-head"><div class="modal-title">${toWh?'Send to Warehouse':'Return to Outlet'}</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="color:var(--muted);margin-bottom:16px">${esc(l.brand)} ${esc(l.model)} — <span class="serial-chip">${esc(l.serial)}</span></p>
    ${toWh?`<div class="field"><label>What is the issue? <span style="color:var(--red)">*required</span></label><textarea id="whComment" placeholder="Describe the fault…"></textarea></div>`
      :`<p style="background:var(--green-soft);color:var(--green);padding:12px 14px;border-radius:10px;font-weight:600">This unit moves back to Outlet and becomes available for sale.</p>`}</div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn ${toWh?'btn-dark':'btn-primary'}" onclick="doStatusChange('${id}',${toWh})">${toWh?'Move to Warehouse':'Return to Outlet'}</button></div>`);}
function doStatusChange(id,toWh){const arr=DB.get('laptops');const i=arr.findIndex(x=>x.id===id);
  if(toWh){const c=val('whComment');if(!c){toast('Please write the issue first','err');return;}arr[i].location='warehouse';arr[i].issue=c;arr[i].locChangedAt=now();}
  else{arr[i].location='outlet';arr[i].issue='';arr[i].locChangedAt=now();}
  DB.save('laptops',arr);closeModal();toast(toWh?'Moved to warehouse':'Returned to outlet');
  if(CURRENT==='warehouse')viewWarehouse();else viewInventory();buildNav();}

/* =============== IMPORT from Google Sheet / Excel =============== */
let IMP={headers:[],rows:[]};
function openImport(){IMP={headers:[],rows:[]};
  openModal(`<div class="modal-head"><div class="modal-title">Import Stock from Google Sheet / Excel</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div style="background:var(--blue-soft);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12.5px;color:#2c5aa0;line-height:1.6">
        <b>From Google Sheets:</b> open your sheet → <b>File → Download → Comma-separated values (.csv)</b> — then upload that file here. Excel (.xlsx) also works.</div>
      <label class="import-drop" style="display:block;cursor:pointer">
        <div style="font-size:34px">📄</div>
        <div style="font-weight:700;margin-top:8px">Click to choose your file</div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">.csv, .xlsx or .xls</div>
        <input type="file" id="impFile" accept=".csv,.xlsx,.xls" style="display:none" onchange="handleImportFile(event)"></label>
      <div id="impStep2"></div></div>
    <div class="modal-foot" id="impFoot"><button class="btn" onclick="closeModal()">Cancel</button></div>`,true);}
function handleImportFile(e){const f=e.target.files[0];if(!f)return;
  if(!window.XLSX){toast('Import engine still loading — try again in a moment','err');return;}
  const r=new FileReader();
  r.onload=ev=>{try{
    const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
    if(!rows.length){toast('That file looks empty','err');return;}
    let hi=0;for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].filter(c=>String(c).trim()!=='').length>=2){hi=i;break;}}
    IMP.headers=rows[hi].map(h=>String(h).trim());
    IMP.rows=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!==''));
    if(!IMP.rows.length){toast('No data rows found','err');return;}
    renderImportMap();
  }catch(err){console.error(err);toast('Could not read that file','err');}};
  r.readAsArrayBuffer(f);}
function guessCol(keys){for(let i=0;i<IMP.headers.length;i++){const h=IMP.headers[i].toLowerCase();
    if(keys.some(k=>h.includes(k)))return i;}return -1;}
const IMPORT_TARGETS=[['brand','Brand',['brand','make','company']],['model','Model',['model','laptop','name','item']],
  ['serial','Serial Number',['serial','s/n','sn','sr','imei','code']],['ram','RAM',['ram','memory']],['storage','Storage (ROM)',['storage','rom','ssd','hdd','disk','drive']],
  ['generation','Generation',['gen','processor','cpu','core']],['screen','Screen Size',['screen','size','display size','inch']],
  ['resolution','Resolution',['resolution','fhd','hd']],['battery','Battery',['battery','backup']],['touch','Touch',['touch']],
  ['finger','Finger Lock',['finger']],['face','Face Lock',['face']],['cam','Camera',['cam','webcam']]];
function renderImportMap(){
  const opts=i=>`<option value="-1">— skip —</option>`+IMP.headers.map((h,idx)=>`<option value="${idx}" ${idx===i?'selected':''}>${esc(h||'(col '+(idx+1)+')')}</option>`).join('');
  const rowsHtml=IMPORT_TARGETS.map(t=>{const g=guessCol(t[2]);
    return `<div class="map-row"><div class="map-k">${t[1]}${['brand','model','serial'].includes(t[0])?' <span style="color:var(--red)">*</span>':''}</div>
      <select id="map_${t[0]}">${opts(g)}</select></div>`;}).join('');
  const prev=`<div class="prev-tbl"><table><thead><tr>${IMP.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${IMP.rows.slice(0,4).map(r=>`<tr>${IMP.headers.map((_,i)=>`<td>${esc(r[i]!==undefined?r[i]:'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  document.getElementById('impStep2').innerHTML=`
    <div style="margin-top:20px"><div style="font-weight:800;font-size:14px;font-family:'Montserrat';margin-bottom:4px">Found ${IMP.rows.length} rows</div>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:10px">Preview:</p>${prev}</div>
    <div style="margin-top:18px"><div style="font-weight:800;font-size:14px;font-family:'Montserrat';margin-bottom:8px">Match your columns</div>${rowsHtml}</div>
    <div class="field" style="margin-top:16px"><label>Import these laptops as</label>
      <div class="seg"><button type="button" class="seg-opt on" id="imp_raw" onclick="setImpStage('raw')">Raw Stock (not checked)</button>
        <button type="button" class="seg-opt" id="imp_ready" onclick="setImpStage('ready')">100% Final Stock</button>
        <input type="hidden" id="imp_stage" value="raw"></div></div>`;
  document.getElementById('impFoot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="runImport()">Import ${IMP.rows.length} Laptops</button>`;}
function setImpStage(s){document.getElementById('imp_stage').value=s;
  document.getElementById('imp_raw').classList.toggle('on',s==='raw');document.getElementById('imp_ready').classList.toggle('on',s==='ready');}
function runImport(){const stage=val('imp_stage')||'raw';const m={};
  IMPORT_TARGETS.forEach(t=>{const s=document.getElementById('map_'+t[0]);m[t[0]]=s?parseInt(s.value):-1;});
  if(m.brand<0&&m.model<0){toast('Map at least Brand or Model','err');return;}
  if(m.serial<0){toast('Serial Number column is required','err');return;}
  const arr=DB.get('laptops');const existing=new Set(arr.filter(l=>l.status!=='sold').map(l=>String(l.serial||'').toLowerCase()));
  let added=0,skipped=0;
  IMP.rows.forEach(r=>{const g=k=>m[k]>=0?String(r[m[k]]!==undefined?r[m[k]]:'').trim():'';
    const serial=g('serial');if(!serial){skipped++;return;}
    if(existing.has(serial.toLowerCase())){skipped++;return;}
    const o={id:uid(),brand:g('brand'),model:g('model'),serial,ram:g('ram'),storage:g('storage'),
      generation:g('generation'),screen:g('screen'),resolution:g('resolution'),battery:g('battery'),
      touch:g('touch'),finger:g('finger'),face:g('face'),cam:g('cam'),
      stage,location:'outlet',issue:'',status:'in_stock',createdAt:now(),locChangedAt:now()};
    if(stage==='ready')o.readyAt=now();
    arr.push(o);existing.add(serial.toLowerCase());added++;});
  DB.save('laptops',arr);closeModal();
  toast(`Imported ${added} laptops${skipped?` · ${skipped} skipped (duplicate/no serial)`:''}`);
  viewInventory();buildNav();}

/* =============== WAREHOUSE =============== */
function viewWarehouse(){const list=warehouseList().sort((a,b)=>(a.locChangedAt||0)-(b.locChangedAt||0));
  const head=`<div class="sec-title">Warehouse — Repair Queue <span class="pill-count">${list.length} units</span></div>
    <p style="color:var(--muted);margin:-8px 0 18px;font-size:13px">Outlet stock with issues. Units over 3 days turn <b style="color:var(--red)">red</b>.</p>`;
  if(!list.length){C().innerHTML=head+emptyState('🏬','Warehouse is empty','No stock units under repair right now.');return;}
  const rows=list.map(l=>{const d=daysBetween(l.locChangedAt||l.createdAt,now());const col=d>3?'red':'orange';
    return `<tr class="rowcol-${col}"><td><span class="serial-chip">${esc(l.serial)}</span></td><td><b>${esc(l.brand)} ${esc(l.model)}</b></td>
      <td style="max-width:280px"><div style="color:var(--red);font-weight:600;font-size:13px">⚠ ${esc(l.issue||'—')}</div></td>
      <td><span class="badge ${d>3?'b-red':'b-orange'}">${d} day${d===1?'':'s'}</span></td>
      <td style="text-align:right"><button class="btn btn-sm btn-primary" onclick="openStatusChange('${l.id}')">✓ Fixed — Return</button></td></tr>`;}).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Serial</th><th>Laptop</th><th>Issue (comment)</th><th>Time</th><th style="text-align:right">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

/* =============== CUSTOMER HELPERS =============== */
function custKey(c){return String(c&&(c.phone1||c.name)||'').trim().toLowerCase();}
function customerList(){const map={};
  DB.get('bills').forEach(b=>{const k=custKey(b.customer);if(!k)return;
    if(!map[k])map[k]={k,info:b.customer,bills:[],spent:0,pending:0,warranties:[]};
    map[k].bills.push(b);map[k].spent+=Number(b.price||0);if(b.isInstallment)map[k].pending+=Number(b.remaining||0);});
  DB.get('warranties').forEach(w=>{const k=String(w.customerPhone||w.customerName||'').trim().toLowerCase();
    if(k&&map[k])map[k].warranties.push(w);});
  return Object.values(map).sort((a,b)=>b.spent-a.spent);}
function findCustomers(q){q=(q||'').trim().toLowerCase();if(q.length<2)return [];
  return customerList().filter(c=>[c.info.name,c.info.phone1,c.info.phone2,c.info.email].join(' ').toLowerCase().includes(q)).slice(0,6);}
function salespersons(){const s=new Set();DB.get('bills').forEach(b=>{if(b.salesperson)s.add(b.salesperson);});return [...s].sort();}
function references(){const s=new Set();DB.get('bills').forEach(b=>{if(b.reference)s.add(b.reference);});return [...s].sort();}

/* =============== POS =============== */
let POS_SELECTED=null;
function viewPOS(){const stock=readyStock().filter(l=>l.location==='outlet');
  C().innerHTML=`<div class="grid" style="grid-template-columns:1.15fr .85fr;align-items:start">

      <div class="card-title" style="margin-bottom:6px">👤 Customer</div>

      <div class="field"><label>Occupation <span class="opt">(optional)</span></label><input id="c_occupation" placeholder="e.g. Student, Business"></div>
      <div class="form-grid">
        <div class="field"><label>Salesperson</label><input id="b_sales" list="spList" placeholder="Who made the sale?"><datalist id="spList">${salespersons().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
        <div class="field"><label>Reference <span class="opt">(optional)</span></label><input id="b_ref" list="refList" placeholder="Who referred?"><datalist id="refList">${references().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div></div>

function posCustSearch(q){const box=document.getElementById('custResults');const res=findCustomers(q);

    <span class="badge b-brand cs-cnt">${c.bills.length} purchase${c.bills.length===1?'':'s'}</span></div>`).join('')}</div>`;}
function pickCustomer(k){const c=customerList().find(x=>x.k===k);if(!c)return;const i=c.info;

function setPay(p){document.getElementById('b_pay').value=p;document.getElementById('pm_cash').classList.toggle('on',p==='CASH');document.getElementById('pm_online').classList.toggle('on',p==='ONLINE');}
function posSelect(id){POS_SELECTED=id?DB.get('laptops').find(l=>l.id===id):null;const el=document.getElementById('posSpecs');

    <div id="instFields"></div>`;}
function setInst(on){document.getElementById('b_isinst').value=on?'1':'0';
  document.getElementById('inst_no').classList.toggle('on',!on);document.getElementById('inst_yes').classList.toggle('on',on);
  document.getElementById('instFields').innerHTML=on?`<div style="background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:2px">
      <div class="form-grid-3"><div class="field"><label>Paid Now (Down)</label><input id="b_paidnow" type="number" placeholder="70000" oninput="updInst()"></div>
        <div class="field"><label>Monthly Instalment</label><input id="b_instamt" type="number" placeholder="10000"></div>
        <div class="field"><label>Next Due Date</label><input id="b_nextdue" type="date" value="${toInput(now()+30*DAY)}"></div></div>
      <div id="instRemain" style="font-weight:700;color:var(--brand-d);font-size:13px"></div></div>`:'';
  updInst();}
function updInst(){const r=document.getElementById('instRemain');if(!r)return;
  const t=Number(val('b_price'))||0,p=Number(val('b_paidnow'))||0;r.textContent=`Remaining after down payment: ${fmtRs(Math.max(t-p,0))}`;}
function generateBill(){if(!POS_SELECTED){toast('Select a laptop by serial first','err');return;}
  const price=Number(val('b_price'));if(!price||price<=0){toast('Enter a valid total price','err');return;}
  const name=val('c_name');if(!name){toast('Enter customer name','err');return;}
  const isInst=val('b_isinst')==='1';const warrM=Number(val('b_warr'))||12;
  const bdate=val('b_date')?new Date(val('b_date')).getTime():now();
  let paidNow=price,remaining=0,instAmt=0,nextDue=null;
  if(isInst){paidNow=Number(val('b_paidnow'))||0;instAmt=Number(val('b_instamt'))||0;remaining=Math.max(price-paidNow,0);
    nextDue=val('b_nextdue')?new Date(val('b_nextdue')).getTime():now()+30*DAY;
    if(remaining<=0){toast('For installment, Paid Now must be less than total','err');return;}}
  const bill={id:uid(),invoiceNo:nextInvoice(),date:bdate,createdAt:now(),
    serial:POS_SELECTED.serial,brand:POS_SELECTED.brand,model:POS_SELECTED.model,laptopId:POS_SELECTED.id,
    specs:{generation:val('b_generation'),ram:val('b_ram'),storage:val('b_storage'),resolution:val('b_resolution'),screen:POS_SELECTED.screen||''},
    price,payment:val('b_pay'),isInstallment:isInst,paidNow,installmentAmount:instAmt,remaining,nextDueDate:nextDue,payments:[],
    salesperson:val('b_sales'),reference:val('b_ref'),
    warrantyMonths:warrM,warrantyTill:bdate+Math.round(warrM*30.44)*DAY,
    customer:{name,email:val('c_email'),phone1:val('c_phone1'),phone2:val('c_phone2'),address:val('c_address'),occupation:val('c_occupation')}};
  const bills=DB.get('bills');bills.push(bill);DB.save('bills',bills);
  const laps=DB.get('laptops');const i=laps.findIndex(l=>l.id===POS_SELECTED.id);if(i>=0){laps[i].status='sold';laps[i].soldAt=bdate;}DB.save('laptops',laps);
  toast('Bill #'+bill.invoiceNo+' created · laptop removed from stock');POS_SELECTED=null;showInvoice(bill.id);}

async function savePDF(f){const n=document.querySelector('#docArea .doc');if(!window.jspdf||!window.html2canvas){toast('PDF engine still loading','err');return;}
  toast('Generating PDF…');try{await (document.fonts?document.fonts.ready:Promise.resolve());
    const cv=await html2canvas(n,{scale:2,useCORS:true,backgroundColor:'#FBF8F2'});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF('p','mm','a4');const w=210,h=cv.height*w/cv.width;
    pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,Math.min(h,297));pdf.save((f||'document')+'.pdf');
  }catch(e){toast('Could not generate PDF','err');console.error(e);}}

/* =============== WARRANTY DESK =============== */
function warranties(){return DB.get('warranties');}
function warrantyGrade(w){if(w.status==='claimed')return 'white';const rem=(w.createdAt+(w.days||0)*DAY-now())/DAY;
  if(rem<1)return 'red';if(rem<=3)return 'orange';return 'green';}
function warrantyCounts(){const a=warranties().filter(w=>w.status==='active');let r=0,o=0,g=0;
  a.forEach(w=>{const x=warrantyGrade(w);if(x==='red')r++;else if(x==='orange')o++;else g++;});return {red:r,orange:o,green:g,activeTotal:a.length};}
function gradeRank(g){return {red:0,orange:1,green:2,white:3}[g];}
function custWarrantyCount(phone,name){const k=String(phone||name||'').trim().toLowerCase();if(!k)return 0;
  return warranties().filter(w=>String(w.customerPhone||w.customerName||'').trim().toLowerCase()===k).length;}
function viewWarranty(){const list=warranties().filter(w=>w.status!=='delivered').sort((a,b)=>gradeRank(warrantyGrade(a))-gradeRank(warrantyGrade(b)));
  const head=`<div style="display:flex;align-items:center;margin-bottom:6px"><div class="sec-title" style="margin:0">Warranty Desk <span class="pill-count">${list.filter(w=>w.status==='active').length} active</span></div>
    <button class="btn btn-primary" style="margin-left:auto" onclick="openAddWarranty()">＋ New Warranty</button></div>
    <p style="color:var(--muted);margin:0 0 18px;font-size:13px">🔴 Urgent (&lt;1 day) · 🟠 Due ≤3 days · 🟢 On track · ⚪ Fixed, awaiting pickup</p>`;
  if(!list.length){C().innerHTML=head+emptyState('🛡️','No warranty claims','When a customer brings a laptop for warranty, add it here.');return;}
  const rows=list.map(w=>{const g=warrantyGrade(w);const rem=Math.ceil((w.createdAt+w.days*DAY-now())/DAY);
    const gb={red:'b-red',orange:'b-orange',green:'b-green',white:'b-gray'}[g];
    const gt=w.status==='claimed'?'Fixed · awaiting pickup':(rem<0?`${-rem}d overdue`:rem===0?'Due today':`${rem}d left`);
    const cnt=custWarrantyCount(w.customerPhone,w.customerName);
    const act=w.status==='active'
      ?`<button class="btn btn-sm btn-primary" onclick="markClaimed('${w.id}')">✓ Mark Fixed</button><button class="btn btn-sm" onclick="warrantyChallan('${w.id}')">🧾 Slip</button>`
      :`<button class="btn btn-sm btn-dark" onclick="markDelivered('${w.id}')">📦 Delivered</button>`;
    return `<tr class="rowcol-${g}"><td><span class="serial-chip">${esc(w.serial)}</span><div style="font-size:11px;color:var(--muted);margin-top:3px">#WR-${w.no} · ${fmtDate(w.createdAt)}</div></td>
      <td><b>${esc(w.customerName||'—')}</b>${cnt>1?`<span class="badge b-purple" style="margin-left:6px">${cnt}× warranty</span>`:''}<div style="font-size:11.5px;color:var(--muted)">${esc(w.customerPhone||'')}</div></td>
      <td><b>${esc(w.name)}</b><div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(w.processor||'')} · ${esc(w.ram||'')} · ${esc(w.storage||'')}</div></td>
      <td style="max-width:220px"><div style="color:var(--red);font-weight:600;font-size:13px">⚠ ${esc(w.issue)}</div>${w.note?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">📝 ${esc(w.note)}</div>`:''}</td>
      <td><span class="badge ${gb}">${gt}</span></td><td style="text-align:right;white-space:nowrap">${act}</td></tr>`;}).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ref / Serial</th><th>Customer</th><th>Laptop</th><th>Issue</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
function openAddWarranty(){openModal(`<div class="modal-head"><div class="modal-title">New Warranty Claim</div><button class="modal-x" onclick="closeModal()">×</button></div>
  <div class="modal-body">
    <div class="field csearch"><label>Search customer <span class="opt">(phone, name or laptop serial)</span></label>

function installmentBills(){return DB.get('bills').filter(b=>b.isInstallment&&b.remaining>0);}
function isDue(b){return b.nextDueDate&&endOfDay(b.nextDueDate)<=now();}
function installmentsDue(){return installmentBills().filter(isDue);}
function viewInstallments(){const list=installmentBills().sort((a,b)=>(a.nextDueDate||0)-(b.nextDueDate||0));
  const dueAmt=list.filter(isDue).reduce((s,b)=>s+b.remaining,0),upAmt=list.filter(b=>!isDue(b)).reduce((s,b)=>s+b.remaining,0);

      ${stat('Due Now',fmtRs(dueAmt),list.filter(isDue).length+' customers overdue','#fdecec','⏰')}
      ${stat('Upcoming',fmtRs(upAmt),(list.length-list.filter(isDue).length)+' not yet due','#e7f7ef','📅')}
      ${stat('Total Outstanding',fmtRs(dueAmt+upAmt),list.length+' active plans','#fff2e8','💳')}</div>
    <div class="sec-title">Active Installment Plans <span class="pill-count">${list.length}</span></div>`;
  if(!list.length){C().innerHTML=head+emptyState('💳','No installments running','Installment sales from POS appear here.');return;}
  const rows=list.map(b=>{const d=isDue(b);const got=b.paidNow+(b.payments||[]).reduce((s,p)=>s+p.amount,0);
    return `<tr class="rowcol-${d?'red':'green'}">
      <td><b>${esc(b.customer.name)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(b.customer.phone1||'')}</div></td>
      <td>${esc(b.brand)} ${esc(b.model)}<div><span class="serial-chip" style="font-size:10px">${esc(b.serial)}</span></div></td>
      <td style="font-size:12.5px">Total ${fmtRs(b.price)}<br><span style="color:var(--green)">Paid ${fmtRs(got)}</span></td>
      <td style="font-weight:800;color:var(--red)">${fmtRs(b.remaining)}</td>
      <td><span class="badge ${d?'b-red':'b-green'}">${d?'DUE':'Upcoming'} · ${fmtDate(b.nextDueDate)}</span></td>
      <td style="text-align:right;white-space:nowrap"><button class="btn btn-sm btn-primary" onclick="openPayInst('${b.id}')">＋ Payment</button>
        <button class="btn btn-sm" onclick="reprintInvoice('${b.id}')">Invoice</button></td></tr>`;}).join('');
  C().innerHTML=head+`<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Laptop</th><th>Total / Paid</th><th>Remaining</th><th>Next Due</th><th style="text-align:right">Action</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}
function openPayInst(id){const b=DB.get('bills').find(x=>x.id===id);
  openModal(`<div class="modal-head"><div class="modal-title">Record Installment Payment</div><button class="modal-x" onclick="closeModal()">×</button></div>
    <div class="modal-body"><p style="color:var(--muted);margin-bottom:14px">${esc(b.customer.name)} · ${esc(b.brand)} ${esc(b.model)}</p>
      <div style="background:var(--brand-soft);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-weight:700;color:var(--brand-d)">Remaining balance: ${fmtRs(b.remaining)}</div>
      <div class="form-grid"><div class="field"><label>Amount received now</label><input id="pi_amt" type="number" value="${Math.min(b.installmentAmount||0,b.remaining)||''}" placeholder="${b.installmentAmount||''}"></div>
        <div class="field"><label>Next due date</label><input id="pi_next" type="date" value="${toInput(now()+30*DAY)}"></div></div></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayInst('${id}')">Save Payment</button></div>`);}
function savePayInst(id){const amt=Number(val('pi_amt'));if(!amt||amt<=0){toast('Enter a valid amount','err');return;}
  const arr=DB.get('bills');const i=arr.findIndex(x=>x.id===id);const b=arr[i];
  const pay=Math.min(amt,b.remaining);b.payments=b.payments||[];b.payments.push({amount:pay,date:now()});
  b.remaining=Math.max(b.remaining-pay,0);
  if(b.remaining>0)b.nextDueDate=val('pi_next')?new Date(val('pi_next')).getTime():now()+30*DAY;else b.nextDueDate=null;
  DB.save('bills',arr);closeModal();toast(b.remaining>0?`Payment saved · ${fmtRs(b.remaining)} remaining`:'Installment fully paid! 🎉');
  viewInstallments();buildNav();}

let _rc=null,_bc=null;

function monthlyBuckets(bills){const map={},labels=[];
  for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');map[k]={rev:0,count:0};
    labels.push({k,lbl:d.toLocaleDateString('en',{month:'short'})+(d.getMonth()===0?" '"+String(d.getFullYear()).slice(2):'')});}
  bills.forEach(b=>{const d=new Date(b.date);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(map[k]){map[k].rev+=Number(b.price);map[k].count++;}});
  return {labels:labels.map(l=>l.lbl),rev:labels.map(l=>map[l.k].rev),count:labels.map(l=>map[l.k].count)};}

      <div class="bd" style="background:var(--blue-soft)"><div class="bl" style="color:var(--blue)">Online Received</div><div class="bv" style="color:var(--blue)">${fmtRs(online)}</div></div>

      <div class="bd" style="background:var(--brand-soft)"><div class="bl" style="color:var(--brand-d)">Total Bills</div><div class="bv" style="color:var(--brand-d)">${bills.length}</div></div></div>

            <div id="yrBox" style="background:#f6f7f8;border:1px solid var(--line);border-radius:14px;padding:16px"></div>

function monthOptions(bills){const set={};

function applyInvFilter(){INV_FILTER={month:val('fMonth'),from:val('fFrom'),to:val('fTo')};renderInvTable();}
function clearInvFilter(){INV_FILTER={month:'',from:'',to:''};['fMonth','fFrom','fTo'].forEach(i=>{const e=document.getElementById(i);if(e)e.value='';});renderInvTable();}
function filteredBills(){let b=DB.get('bills').slice().sort((a,c)=>c.date-a.date);
