/* ---- YEAR-WISE: bills line chart + revenue bar chart + average laptop sale ---- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let REV_YEAR=null,REV_MONTH=null;
function yearOptions(bills){const set=new Set();bills.forEach(b=>set.add(new Date(b.date).getFullYear()));
  const cy=new Date().getFullYear();set.add(cy);
  const years=[...set].sort((a,c)=>c-a);
  if(REV_YEAR===null||!years.includes(REV_YEAR))REV_YEAR=cy;
  return years.map(y=>`<option value="${y}"${y===REV_YEAR?' selected':''}>${y}</option>`).join('');}
function yearChange(){REV_YEAR=Number(val('yrSel'));REV_MONTH=null;drawYearCharts();}
function pickMonth(i){REV_MONTH=(REV_MONTH===i?null:i);drawYearCharts();}
function yearData(){const bills=DB.get('bills').filter(b=>new Date(b.date).getFullYear()===REV_YEAR);
  const count=Array(12).fill(0),rev=Array(12).fill(0);
  bills.forEach(b=>{const m=new Date(b.date).getMonth();count[m]++;rev[m]+=Number(b.price||0);});
  return {count,rev};}
function drawYearCharts(){if(!window.Chart)return;
  const d=yearData();
  const yl=document.getElementById('yrLbl');if(yl)yl.textContent=REV_YEAR;

  /* ----- Line chart: number of bills, number likha hua har point par ----- */
  const c2=document.getElementById('billChart');
  if(c2){
    const dotLabels={id:'dotLabels',afterDatasetsDraw(ch){const ctx=ch.ctx;const meta=ch.getDatasetMeta(0);
      ctx.save();ctx.font='800 12px Inter, system-ui, sans-serif';ctx.textAlign='center';
      meta.data.forEach((pt,i)=>{const v=d.count[i];if(!v)return;
        ctx.fillStyle=(i===REV_MONTH)?'#c4621e':'#12161a';ctx.fillText(String(v),pt.x,pt.y-16);});ctx.restore();}};
    if(_bc)_bc.destroy();
    let g='rgba(31,169,113,.18)';
    try{const ctx=c2.getContext('2d');if(ctx&&ctx.createLinearGradient){const lg=ctx.createLinearGradient(0,0,0,270);
      lg.addColorStop(0,'rgba(31,169,113,.32)');lg.addColorStop(1,'rgba(31,169,113,0)');g=lg;}}catch(e){}
    _bc=new Chart(c2,{type:'line',data:{labels:MON,datasets:[{label:'Bills',data:d.count,borderColor:'#1fa971',backgroundColor:g,
      fill:true,tension:.35,borderWidth:3,
      pointRadius:d.count.map((v,i)=>i===REV_MONTH?9:6),
      pointBackgroundColor:'#fff',
      pointBorderColor:d.count.map((v,i)=>i===REV_MONTH?'#ff7c2a':'#1fa971'),
      pointBorderWidth:d.count.map((v,i)=>i===REV_MONTH?5:4),pointHoverRadius:9}]},
      options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24}},
        onClick:(e,el)=>{if(el&&el.length)pickMonth(el[0].index);},
        onHover:(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default';},
        plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>MON[c[0].dataIndex]+' '+REV_YEAR,
          label:c=>{const i=c.dataIndex;const a=d.count[i]?Math.round(d.rev[i]/d.count[i]):0;
            return [c.raw+' bill'+(c.raw===1?'':'s'),'Revenue: '+fmtRs(d.rev[i]),'Avg laptop sale: '+fmtRs(a)];}}}},
        scales:{y:{beginAtZero:true,ticks:{stepSize:1,precision:0,font:{size:11}},grid:{color:'#eef0f2'},border:{display:false}},
          x:{grid:{display:false},border:{display:false},ticks:{font:{size:11,weight:'700'}}}}},plugins:[dotLabels]});}

  /* ----- Bar chart: monthly revenue (same year), click = average sale ----- */
  const c1=document.getElementById('revChart');
  if(c1){if(_rc)_rc.destroy();
    _rc=new Chart(c1,{type:'bar',data:{labels:MON,datasets:[{label:'Revenue',data:d.rev,
      backgroundColor:d.rev.map((v,i)=>i===REV_MONTH?'#c4621e':'#ff7c2a'),hoverBackgroundColor:'#c4621e',borderRadius:7,barPercentage:.68}]},
      options:{responsive:true,maintainAspectRatio:false,
        onClick:(e,el)=>{if(el&&el.length)pickMonth(el[0].index);},
        onHover:(e,el)=>{e.native.target.style.cursor=el.length?'pointer':'default';},
        plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>MON[c[0].dataIndex]+' '+REV_YEAR,
          label:c=>{const i=c.dataIndex;const a=d.count[i]?Math.round(d.rev[i]/d.count[i]):0;
            return ['Revenue: '+fmtRs(d.rev[i]),d.count[i]+' bill'+(d.count[i]===1?'':'s'),'Avg laptop sale: '+fmtRs(a)];}}}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rs '+(v/1000)+'k',font:{size:11}},grid:{color:'#eef0f2'},border:{display:false}},
          x:{grid:{display:false},border:{display:false},ticks:{font:{size:11}}}}}});}

  renderAvgBox(d);}
function renderAvgBox(d){const ab=document.getElementById('avgBox'),yb=document.getElementById('yrBox');if(!ab)return;
  const tCount=d.count.reduce((a,b)=>a+b,0),tRev=d.rev.reduce((a,b)=>a+b,0);
  const isM=REV_MONTH!==null;
  const cnt=isM?d.count[REV_MONTH]:tCount, rv=isM?d.rev[REV_MONTH]:tRev;
  const avg=cnt?Math.round(rv/cnt):0;
  ab.innerHTML=`<div style="font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--brand-d);text-transform:uppercase">Average Laptop Sale</div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:700">${isM?MON[REV_MONTH]+' '+REV_YEAR:'Whole Year '+REV_YEAR}</div>
    <div style="font-size:27px;font-weight:800;margin-top:8px;color:#12161a;line-height:1.2">${fmtRs(avg)}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:4px">Total Revenue ÷ Number of Bills</div>
    ${isM?`<button class="btn btn-sm" style="margin-top:10px" onclick="pickMonth(${REV_MONTH})">← Whole Year</button>`:''}`;
  if(yb)yb.innerHTML=`<div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:var(--muted);font-size:12.5px">Number of Bills</span><b>${cnt}</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span style="color:var(--muted);font-size:12.5px">Total Revenue</span><b>${fmtRs(rv)}</b></div>
    <div style="display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line)"><span style="color:var(--muted);font-size:12.5px">Best Month</span><b>${(()=>{const m=d.count.indexOf(Math.max(...d.count));return tCount?MON[m]+' ('+d.count[m]+')':'—';})()}</b></div>`;}

/* =============== SEARCH =============== */
function quickSearch(q){document.getElementById('globalSearch').value=q;go('search');
  setTimeout(()=>{const i=document.getElementById('searchInput');if(i){i.value=q;runSearch(q);}},60);}
function viewSearchPage(){const pre=document.getElementById('globalSearch').value||'';
  C().innerHTML=`<div class="card card-pad" style="margin-bottom:18px"><div class="field" style="margin:0">
    <label>Search by phone number, serial number, customer name, or model</label>
    <input id="searchInput" placeholder="Type to search…" oninput="runSearch(this.value)" value="${esc(pre)}"></div></div><div id="searchResults"></div>`;
  const i=document.getElementById('searchInput');i.focus();if(pre)runSearch(pre);}
function runSearch(q){q=(q||'').trim().toLowerCase();const box=document.getElementById('searchResults');if(!box)return;
  if(q.length<2){box.innerHTML=`<div class="empty"><div class="empty-ic">⌕</div><div class="empty-t">Start typing</div><div class="empty-s">Search bills, inventory and warranty.</div></div>`;return;}
  const bills=DB.get('bills').filter(b=>[b.customer.name,b.customer.phone1,b.customer.phone2,b.customer.email,b.serial,b.brand,b.model,'#'+b.invoiceNo,b.salesperson,b.reference].join(' ').toLowerCase().includes(q));
  const laps=inventory().filter(l=>[l.serial,l.brand,l.model,l.generation].join(' ').toLowerCase().includes(q));
  const warr=warranties().filter(w=>[w.name,w.serial,w.customerName,w.customerPhone].join(' ').toLowerCase().includes(q));
  let h='';
  if(bills.length)h+=`<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="card-title">🧾 Sales / Customers</div><span class="pill-count" style="margin-left:auto">${bills.length}</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Invoice</th><th>Customer</th><th>Laptop</th><th style="text-align:right">Amount</th><th></th></tr></thead>
    <tbody>${bills.slice().reverse().map(b=>`<tr><td class="mono">#${b.invoiceNo}<div style="font-size:11px;color:var(--muted);font-weight:400">${fmtDate(b.date)}</div></td>
      <td><b>${esc(b.customer.name)}</b><div style="font-size:11.5px;color:var(--muted)">${esc(b.customer.phone1||'')}</div></td>
      <td>${esc(b.brand)} ${esc(b.model)}<div><span class="serial-chip" style="font-size:10px">${esc(b.serial)}</span></div></td>
      <td style="text-align:right;font-weight:700">${fmtRs(b.price)}</td>
      <td style="text-align:right"><button class="btn btn-sm" onclick="reprintInvoice('${b.id}')">Invoice</button></td></tr>`).join('')}</tbody></table></div></div>`;
  if(laps.length)h+=`<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="card-title">💻 Inventory</div><span class="pill-count" style="margin-left:auto">${laps.length}</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Serial</th><th>Laptop</th><th>Stage</th><th>Location</th></tr></thead>
    <tbody>${laps.map(l=>`<tr><td><span class="serial-chip">${esc(l.serial)}</span></td><td><b>${esc(l.brand)} ${esc(l.model)}</b>
      <div style="font-size:12px;color:var(--muted)">${esc(l.ram||'')} · ${esc(l.storage||'')}</div></td>
      <td><span class="badge ${l.stage==='ready'?'b-green':'b-red'}">${l.stage==='ready'?'Ready':'Raw'}</span></td>
      <td><span class="badge ${l.location==='warehouse'?'b-orange':'b-green'}">${l.location==='warehouse'?'Warehouse':'Outlet'}</span></td></tr>`).join('')}</tbody></table></div></div>`;
  if(warr.length)h+=`<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="card-title">🛡 Warranty</div><span class="pill-count" style="margin-left:auto">${warr.length}</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ref</th><th>Customer</th><th>Laptop</th><th>Status</th></tr></thead>
    <tbody>${warr.map(w=>`<tr><td class="mono">#WR-${w.no}</td><td><b>${esc(w.customerName||'—')}</b></td><td>${esc(w.name)}
      <div style="font-size:11.5px;color:var(--red)">⚠ ${esc(w.issue||'')}</div></td>
      <td><span class="badge ${w.status==='delivered'?'b-green':w.status==='claimed'?'b-gray':'b-orange'}">${esc(w.status)}</span></td></tr>`).join('')}</tbody></table></div></div>`;
  box.innerHTML=h||`<div class="empty"><div class="empty-ic">🔍</div><div class="empty-t">No results for "${esc(q)}"</div><div class="empty-s">Try a different phone, serial, name or model.</div></div>`;}

/* =============== EXPORT =============== */
function viewExport(){C().innerHTML=`<div class="card card-pad" style="max-width:640px">
    <div class="card-title" style="margin-bottom:6px">⤓ Export to Excel</div>
    <p style="color:var(--muted);margin-bottom:20px;font-size:13.5px">Download records as Excel. Filter invoices by date range if you like.</p>
    <div class="form-grid"><div class="field"><label>From date <span class="opt">(optional)</span></label><input type="date" id="ex_from"></div>
      <div class="field"><label>To date <span class="opt">(optional)</span></label><input type="date" id="ex_to"></div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary btn-lg" onclick="exportBills()">🧾 Export Invoices / Customers</button>
      <button class="btn btn-dark btn-lg" onclick="exportInventory()">💻 Export Inventory</button></div></div>`;}
function exportBills(){if(!window.XLSX){toast('Excel engine still loading','err');return;}
  let bills=DB.get('bills');const f=val('ex_from'),t=val('ex_to');
  if(f)bills=bills.filter(b=>b.date>=new Date(f).setHours(0,0,0,0));
  if(t)bills=bills.filter(b=>b.date<=new Date(t).setHours(23,59,59,999));
  if(!bills.length){toast('No bills in this range','err');return;}
  const rows=bills.map(b=>({Invoice:'#'+b.invoiceNo,Date:fmtDate(b.date),Customer:b.customer.name,Phone1:b.customer.phone1,Phone2:b.customer.phone2,
    Email:b.customer.email,Address:b.customer.address,Occupation:b.customer.occupation,Salesperson:b.salesperson||'',Reference:b.reference||'',
    Serial:b.serial,Laptop:b.brand+' '+b.model,Generation:b.specs.generation,RAM:b.specs.ram,Storage:b.specs.storage,
    Payment:b.payment,Installment:b.isInstallment?'Yes':'No',Total:Number(b.price),
    Paid:b.isInstallment?b.paidNow+(b.payments||[]).reduce((a,p)=>a+p.amount,0):Number(b.price),
    Remaining:b.isInstallment?Number(b.remaining):0,WarrantyTill:fmtDate(b.warrantyTill)}));
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Invoices');XLSX.writeFile(wb,'Denzen-Invoices-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Exported '+rows.length+' invoices');}
function exportInventory(){if(!window.XLSX){toast('Excel engine still loading','err');return;}
  const rows=inventory().map(l=>({Stage:l.stage==='ready'?'Final Ready':'Raw',Serial:l.serial,Brand:l.brand,Model:l.model,Generation:l.generation,
    RAM:l.ram,Storage:l.storage,Camera:l.cam,Resolution:l.resolution,Screen:l.screen,Touch:l.touch,FingerLock:l.finger,FaceLock:l.face,
    Battery:l.battery,Location:l.location,Issue:l.issue}));
  if(!rows.length){toast('Inventory is empty','err');return;}
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Inventory');XLSX.writeFile(wb,'Denzen-Inventory-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Exported '+rows.length+' laptops');}

/* =============== DASHBOARD =============== */
function viewDashboard(){const wc=warrantyCounts();const wh=warehouseList();
  const whRed=wh.filter(l=>daysBetween(l.locChangedAt||l.createdAt,now())>3).length;
  const ready=readyStock(),raw=rawStock();const totalStock=ready.length+raw.length;
  const inst=installmentBills();const due=inst.filter(isDue);
  const dueAmt=due.reduce((s,b)=>s+b.remaining,0),upAmt=inst.filter(b=>!isDue(b)).reduce((s,b)=>s+b.remaining,0);
  C().innerHTML=`
    <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">
      ${stat('Total Stock',totalStock,ready.length+' ready · '+raw.length+' raw','#eaf1fe','💻')}
      ${stat('In Warehouse',wh.length,whRed+' over 3 days','#fef3e2','🏬')}
      ${stat('Active Warranties',wc.activeTotal,wc.red+' urgent','#f1ecfe','🛡')}
      ${stat('Installments Due',due.length,fmtRs(dueAmt)+' to collect','#fdecec','💳')}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:18px">
      <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">💻 Stock Readiness</div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Checked vs not checked</p>
        <div class="wbox" style="grid-template-columns:1fr 1fr">
          <div class="wcell g"><div class="n">${ready.length}</div><div class="l">Ready Stock</div></div>
          <div class="wcell r"><div class="n">${raw.length}</div><div class="l">Not Ready</div></div></div>
        <div class="wtotal"><span class="lab">Total laptops</span><span class="val">${totalStock}</span></div></div>
      <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">🛡 Warranty Claims</div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Customer laptops in for repair</p>
        <div class="wbox"><div class="wcell r"><div class="n">${wc.red}</div><div class="l">Urgent</div></div>
          <div class="wcell o"><div class="n">${wc.orange}</div><div class="l">≤ 3 Days</div></div>
          <div class="wcell g"><div class="n">${wc.green}</div><div class="l">On Track</div></div></div>
        <div class="wtotal"><span class="lab">Total active claims</span><span class="val">${wc.activeTotal}</span></div></div>
      <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">💳 Installments</div>
        <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Money to collect</p>
        <div class="wbox" style="grid-template-columns:1fr 1fr">
          <div class="wcell r"><div class="n" style="font-size:19px">${fmtRs(dueAmt)}</div><div class="l">Due Now (${due.length})</div></div>
          <div class="wcell g"><div class="n" style="font-size:19px">${fmtRs(upAmt)}</div><div class="l">Upcoming</div></div></div>
        <div class="wtotal"><span class="lab">Total outstanding</span><span class="val">${fmtRs(dueAmt+upAmt)}</span></div></div></div>
    <div class="card card-pad"><div class="card-title" style="margin-bottom:4px">🏬 Outlet Stock Repairs</div>
      <p style="color:var(--muted);font-size:12.5px;margin-bottom:12px">Your own stock units under repair</p>
      <div class="wbox" style="grid-template-columns:1fr 1fr;max-width:420px">
        <div class="wcell r"><div class="n">${whRed}</div><div class="l">Over 3 Days</div></div>
        <div class="wcell g"><div class="n">${wh.length-whRed}</div><div class="l">Within 3 Days</div></div></div>
      <div class="wtotal" style="max-width:420px"><span class="lab">Total in warehouse</span><span class="val">${wh.length}</span></div></div>`;}

/* =============== SETTINGS =============== */
function viewSettings(){const s=settings();
  C().innerHTML=`<div style="max-width:640px">
    <div class="card card-pad" style="margin-bottom:18px"><div class="card-title" style="margin-bottom:6px">🔑 Access Passwords</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:18px">Set a password for each login. Leave blank to open without a password.</p>
      ${Object.entries(ROLES).map(([k,r])=>`<div class="field"><label>${r.icon} ${r.label}</label><input id="pw_${k}" value="${esc(s.passwords[k]||'')}" placeholder="(no password)"></div>`).join('')}
      <div class="field"><label>📈 Revenue section (extra lock inside Owner)</label><input id="pw_revenue" value="${esc(s.revenuePassword||'')}" placeholder="(no password)"></div>
      <button class="btn btn-primary" onclick="savePasswords()">Save Passwords</button></div>
    <div class="card card-pad" style="margin-bottom:18px"><div class="card-title" style="margin-bottom:6px">💾 Backup & Restore</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Your data lives in this browser. <b style="color:var(--red)">Take a backup regularly</b> — if the browser data is cleared, everything is lost.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="backupData()">⬇ Download Backup</button>
        <label class="btn" style="cursor:pointer">⬆ Restore Backup<input type="file" accept=".json" style="display:none" onchange="restoreData(event)"></label></div></div>
    <div class="card card-pad"><div class="card-title" style="margin-bottom:6px">🗄 Data</div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Load sample data to explore, or clear everything to start fresh with your own records.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="seedDemo(true)">Load Sample Data</button>
        <button class="btn btn-danger" onclick="clearAll()">Clear All Data</button></div></div>
    <p style="color:var(--muted2);font-size:12px;margin-top:16px;line-height:1.6">For multiple computers/staff to share the same live data, connect this to Firebase (cloud).</p></div>`;}
function savePasswords(){const s=settings();Object.keys(ROLES).forEach(k=>{s.passwords[k]=document.getElementById('pw_'+k).value.trim();});
  s.revenuePassword=document.getElementById('pw_revenue').value.trim();saveSettings(s);toast('Passwords updated');}
function backupData(){const data={laptops:DB.get('laptops'),bills:DB.get('bills'),warranties:DB.get('warranties'),settings:settings(),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='Denzen-Backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup downloaded — keep it safe');}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(!d.laptops&&!d.bills){toast('That file is not a Denzen backup','err');return;}
    confirmBox('Restore this backup?','Your current data will be replaced with the backup.',()=>{
      DB.save('laptops',d.laptops||[]);DB.save('bills',d.bills||[]);DB.save('warranties',d.warranties||[]);
      if(d.settings)saveSettings(d.settings);closeModal();toast('Backup restored');go('dashboard');buildNav();});
  }catch(err){toast('Could not read that backup file','err');}};
  r.readAsText(f);}
function clearAll(){confirmBox('Clear ALL data?','Every laptop, bill and warranty record will be deleted. Take a backup first!',()=>{
  DB.save('laptops',[]);DB.save('bills',[]);DB.save('warranties',[]);
  const s=settings();s.invoiceNo=1735;s.warrantyNo=1;saveSettings(s);closeModal();toast('All data cleared');go('dashboard');buildNav();});}
